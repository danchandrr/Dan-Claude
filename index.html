<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zebra Shift</title>
<meta name="description" content="An ER roguelike: diagnose, treat and survive the night shift.">
<meta name="theme-color" content="#1C6973">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zebra Shift">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky HUD over a two-column ER bay — patient chart left, orders + diagnosis right; stacks on phones. */
:root{
  --bg:#E8EEED; --panel:#F8FBFA; --panel-2:#EEF4F3; --ink:#102127; --muted:#566B70; --line:#C6D4D3;
  --scrub:#1C6973; --scrub-ink:#FFFFFF; --scrub-soft:#D5E7E8;
  --alarm:#BE3329; --amber:#B97C0C; --ok:#2C7A4C;
  --t0:#76878A; --t1:#2C7A4C; --t2:#2260A6; --t3:#3A3A3A; --t4:#A87A06;
  --band:#FFFFFF; --band-ink:#14262B;
  --mon-bg:#0A1315; --mon-grid:#13252A; --mon-hr:#5BE38A; --mon-bp:#FF7D6E; --mon-sp:#5FD3F0; --mon-rr:#F2D35B; --mon-t:#E8EEF0;
  --shadow:0 1px 0 rgba(16,33,39,.06),0 6px 18px -10px rgba(16,33,39,.25);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D181B; --panel:#142328; --panel-2:#1A2C31; --ink:#E2EDEB; --muted:#8EA4A8; --line:#283C41;
  --scrub:#4FB0BA; --scrub-ink:#06181B; --scrub-soft:#1B3A3F;
  --alarm:#F0665B; --amber:#E7B04B; --ok:#5DC489;
  --t0:#93A4A7; --t1:#5DC489; --t2:#73A9F2; --t3:#E9EEEF; --t4:#E8BD4E;
  --band:#E9F0EF; --band-ink:#14262B;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D181B; --panel:#142328; --panel-2:#1A2C31; --ink:#E2EDEB; --muted:#8EA4A8; --line:#283C41;
  --scrub:#4FB0BA; --scrub-ink:#06181B; --scrub-soft:#1B3A3F;
  --alarm:#F0665B; --amber:#E7B04B; --ok:#5DC489;
  --t0:#93A4A7; --t1:#5DC489; --t2:#73A9F2; --t3:#E9EEEF; --t4:#E8BD4E;
  --band:#E9F0EF; --band-ink:#14262B;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--scrub);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
/* Background: a slow diagonal drift of line-drawn medical icons, tinted by the theme */
body::after{content:"";position:fixed;top:-240px;left:-240px;width:calc(100% + 480px);height:calc(100% + 480px);z-index:-1;pointer-events:none;background:var(--scrub);opacity:.09;-webkit-mask:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22240%22 height=%22240%22 viewBox=%220 0 240 240%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.8%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cg transform=%22translate%2818 22%29 rotate%280 15 15%29 scale%281.25%29%22%3E%3Cpath d=%22M9 3h6v6h6v6h-6v6H9v-6H3V9h6z%22/%3E%3C/g%3E%3Cg transform=%22translate%28100 14%29 rotate%280 15 15%29 scale%281.25%29%22%3E%3Cpath d=%22M1 13h5l2-6 3 11 3-8 2 3h7%22/%3E%3C/g%3E%3Cg transform=%22translate%28176 38%29 rotate%28-35 15 15%29 scale%281.25%29%22%3E%3Crect x=%222%22 y=%228%22 width=%2220%22 height=%228%22 rx=%224%22/%3E%3Cpath d=%22M12 8v8%22/%3E%3C/g%3E%3Cg transform=%22translate%2836 100%29 rotate%2810 15 15%29 scale%281.25%29%22%3E%3Cpath d=%22M5 3v6a5 5 0 0 0 10 0V3M10 14v2a5 5 0 0 0 10 0v-2%22/%3E%3Ccircle cx=%2220%22 cy=%2212%22 r=%222%22/%3E%3C/g%3E%3Cg transform=%22translate%28118 92%29 rotate%28-8 15 15%29 scale%281.25%29%22%3E%3Cpath d=%22M12 20s-8-4.8-8-10.5A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 8 2.5C20 15.2 12 20 12 20z%22/%3E%3C/g%3E%3Cg transform=%22translate%28192 118%29 rotate%280 15 15%29 scale%281.25%29%22%3E%3Cpath d=%22M18 2l4 4M20 4l-3 3M17 7l-9.5 9.5-3-3L14 4zM7.5 16.5 3 21M10 8l2 2M7.5 10.5l2 2%22/%3E%3C/g%3E%3Cg transform=%22translate%2820 182%29 rotate%280 15 15%29 scale%281.25%29%22%3E%3Cpath d=%22M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z%22/%3E%3C/g%3E%3Cg transform=%22translate%2896 170%29 rotate%280 15 15%29 scale%281.25%29%22%3E%3Crect x=%222%22 y=%228%22 width=%2220%22 height=%228%22 rx=%224%22 transform=%22rotate%28-45 12 12%29%22/%3E%3Cpath d=%22M10.5 10.5h.01M13.5 13.5h.01M13.5 10.5h.01M10.5 13.5h.01%22/%3E%3C/g%3E%3Cg transform=%22translate%28178 196%29 rotate%2820 15 15%29 scale%281.25%29%22%3E%3Cpath d=%22M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z%22/%3E%3C/g%3E%3C/svg%3E") 0 0/240px 240px repeat;mask:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22240%22 height=%22240%22 viewBox=%220 0 240 240%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.8%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cg transform=%22translate%2818 22%29 rotate%280 15 15%29 scale%281.25%29%22%3E%3Cpath d=%22M9 3h6v6h6v6h-6v6H9v-6H3V9h6z%22/%3E%3C/g%3E%3Cg transform=%22translate%28100 14%29 rotate%280 15 15%29 scale%281.25%29%22%3E%3Cpath d=%22M1 13h5l2-6 3 11 3-8 2 3h7%22/%3E%3C/g%3E%3Cg transform=%22translate%28176 38%29 rotate%28-35 15 15%29 scale%281.25%29%22%3E%3Crect x=%222%22 y=%228%22 width=%2220%22 height=%228%22 rx=%224%22/%3E%3Cpath d=%22M12 8v8%22/%3E%3C/g%3E%3Cg transform=%22translate%2836 100%29 rotate%2810 15 15%29 scale%281.25%29%22%3E%3Cpath d=%22M5 3v6a5 5 0 0 0 10 0V3M10 14v2a5 5 0 0 0 10 0v-2%22/%3E%3Ccircle cx=%2220%22 cy=%2212%22 r=%222%22/%3E%3C/g%3E%3Cg transform=%22translate%28118 92%29 rotate%28-8 15 15%29 scale%281.25%29%22%3E%3Cpath d=%22M12 20s-8-4.8-8-10.5A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 8 2.5C20 15.2 12 20 12 20z%22/%3E%3C/g%3E%3Cg transform=%22translate%28192 118%29 rotate%280 15 15%29 scale%281.25%29%22%3E%3Cpath d=%22M18 2l4 4M20 4l-3 3M17 7l-9.5 9.5-3-3L14 4zM7.5 16.5 3 21M10 8l2 2M7.5 10.5l2 2%22/%3E%3C/g%3E%3Cg transform=%22translate%2820 182%29 rotate%280 15 15%29 scale%281.25%29%22%3E%3Cpath d=%22M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z%22/%3E%3C/g%3E%3Cg transform=%22translate%2896 170%29 rotate%280 15 15%29 scale%281.25%29%22%3E%3Crect x=%222%22 y=%228%22 width=%2220%22 height=%228%22 rx=%224%22 transform=%22rotate%28-45 12 12%29%22/%3E%3Cpath d=%22M10.5 10.5h.01M13.5 13.5h.01M13.5 10.5h.01M10.5 13.5h.01%22/%3E%3C/g%3E%3Cg transform=%22translate%28178 196%29 rotate%2820 15 15%29 scale%281.25%29%22%3E%3Cpath d=%22M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z%22/%3E%3C/g%3E%3C/svg%3E") 0 0/240px 240px repeat;animation:bgdrift 48s linear infinite;will-change:transform}
@keyframes bgdrift{to{transform:translate3d(240px,240px,0)}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body::after{opacity:.11}}
:root[data-theme="dark"] body::after{opacity:.11}
@media (min-width:1500px){.wrap,.hud-in{max-width:1400px}}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hud-in{max-width:1240px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand .z{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:repeating-linear-gradient(135deg,#111 0 5px,#f4f4f4 5px 10px)}
.brand .z svg{width:20px;height:20px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;padding:6px 10px;border-radius:7px;font-weight:700;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.tabs button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.tabs .dot{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--scrub);color:var(--scrub-ink);font-size:11px;line-height:18px}
.stats{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat .label{display:inline-flex;align-items:center;gap:4px}
.stat .label .ic{width:12px;height:12px}
.stat b{font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.rep{display:flex;gap:3px}
.rep svg{width:17px;height:17px}
.drchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 12px 3px 3px;text-align:left;line-height:1.1}
.drchip b{font-size:13px;display:block}
.drchip small{font-size:11px;color:var(--muted)}
.mini{width:30px;height:30px;border-radius:50%;flex:none}

/* generic */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:700;display:inline-flex;align-items:center;gap:7px}
.btn:hover:not(:disabled){border-color:var(--scrub)}
.btn.primary{background:var(--scrub);border-color:var(--scrub);color:var(--scrub-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.danger{color:var(--alarm)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tier{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:99px;border:1.5px solid currentColor;white-space:nowrap}
.tier.t0{color:var(--t0)} .tier.t1{color:var(--t1)} .tier.t2{color:var(--t2)} .tier.t4{color:var(--t4)}
.tier.t3{color:#111;border-color:#111;background:repeating-linear-gradient(120deg,#fff 0 6px,#e6e6e6 6px 12px)}
.tier.t3 span{background:#fff;padding:0 3px;border-radius:3px}
.tier.t4{background:color-mix(in srgb,var(--t4) 14%,transparent)}
.intro{display:flex;gap:14px;align-items:flex-start;padding:12px 16px;margin-bottom:14px;background:var(--scrub-soft);border-radius:12px;border:1px solid color-mix(in srgb,var(--scrub) 30%,transparent)}
.intro p{margin:0;max-width:95ch}
.intro .x{margin-left:auto;border:0;background:transparent;font-size:20px;line-height:1;color:var(--muted);padding:2px 6px}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}

/* bay */
.bay{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.bay{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.band{position:relative;background:var(--band);color:var(--band-ink);border-radius:999px;padding:8px 22px 8px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.08)}
.band::before{content:"";position:absolute;left:10px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:#B9C4C3;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.band .who{min-width:0}
.band .who b{font-family:var(--f-display);font-size:19px;letter-spacing:-.01em;display:block;line-height:1.2}
.band .who span{font-family:var(--f-mono);font-size:12px;color:#4C5F63}
.avatar{width:54px;height:54px;flex:none;border-radius:50%;margin-left:-6px}
.barcode{height:30px;width:96px;flex:none;background:repeating-linear-gradient(90deg,#14262B 0 2px,transparent 2px 3px,#14262B 3px 4px,transparent 4px 7px,#14262B 7px 10px,transparent 10px 11px);opacity:.85;margin-left:auto}
.gr{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:#14262B;color:#F4D35E;padding:3px 9px;border-radius:99px}

.scene{position:relative;overflow:hidden;padding:0}
.scene svg{display:block;width:100%;height:auto}
.avpu{position:absolute;top:10px;left:10px;font-size:12px;font-weight:700;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 10px;display:inline-flex;align-items:center;gap:6px}
.avpu i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.avpu.warn i{background:var(--amber)} .avpu.crit i{background:var(--alarm);animation:blink 1s steps(2,end) infinite}
.shake{animation:shake .18s linear infinite}
.shiver{animation:shiver .12s linear infinite}
@keyframes shake{25%{transform:translate(1.2px,-.8px)}50%{transform:translate(-1px,.8px)}75%{transform:translate(.8px,1px)}}
@keyframes shiver{50%{transform:translateX(.7px)}}
.alarm{animation:alarm 1s ease-in-out infinite}
@keyframes alarm{0%,100%{opacity:0}50%{opacity:.22}}

.monitor{background:var(--mon-bg);border-radius:14px;padding:10px 12px 12px;color:var(--mon-t);border:1px solid #1d2f34}
.monitor canvas{display:block;width:100%;height:58px;border-radius:6px;background:
  linear-gradient(var(--mon-grid) 1px,transparent 1px) 0 0/100% 14.5px,
  linear-gradient(90deg,var(--mon-grid) 1px,transparent 1px) 0 0/14.5px 100%}
.vitals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px}
@media (max-width:520px){.vitals{grid-template-columns:repeat(3,minmax(0,1fr))}}
.vital{padding:4px 6px;border-left:2px solid currentColor;min-width:0}
.vital small{display:block;font:700 10px/1.2 var(--f-body);letter-spacing:.1em;opacity:.8}
.vital b{font:700 22px/1.15 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.vital b i{font-style:normal;font-size:12px;opacity:.7;margin-left:2px}
.vital.ab b{animation:blink 1.4s steps(2,end) infinite}
@keyframes blink{50%{opacity:.45}}

.cc{padding:14px 18px}
.cc q{display:block;font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.25;quotes:"\201C" "\201D";margin-top:4px}
.flags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.flag{font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;background:var(--panel-2);border:1px dashed var(--line);display:inline-flex;align-items:center;gap:5px}
.chart{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.chart{grid-template-columns:minmax(0,1fr)}}
.sec{padding:12px 14px;min-width:0}
.sec header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.sec h3{font-size:15px;display:flex;align-items:center;gap:7px}
.sec h3 .ic{color:var(--scrub)}
.sec ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sec li{padding:7px 10px;border-radius:8px;background:var(--panel-2);font-size:14px}
.sec li.lock{background:transparent;border:1px dashed var(--line);color:var(--muted);font-style:italic}
.sec li.new{animation:pop .5s ease-out}
.sec li.empty{background:transparent;color:var(--muted);font-style:italic;padding:2px 0}
.sec li.none{display:none;background:transparent;color:var(--muted);font-style:italic;padding:2px 0}
.pinbar,.emvit{display:none}
details.entry summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:5px}
details.entry summary::-webkit-details-marker{display:none}
details.entry[open]{border-color:var(--scrub)}
details.entry .pearl{margin:6px 0 0;font-size:13px}
@keyframes pop{from{background:var(--scrub-soft);transform:translateY(-3px)}}

.orders{padding:14px}
.stab{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.segs{display:flex;gap:3px;margin-bottom:14px}
.segs i{flex:1;height:12px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line)}
.segs i.on{background:var(--ok);border-color:transparent}
.segs.mid i.on{background:var(--amber)} .segs.low i.on{background:var(--alarm)}
.ordgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ord{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 11px}
.ord:hover:not(:disabled){border-color:var(--scrub);background:var(--scrub-soft)}
.ord:disabled{opacity:.45;cursor:not-allowed}
.ord .oi{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--scrub);flex:none}
.ord .oi .ic{width:20px;height:20px}
.ord .ot{display:flex;flex-direction:column;gap:1px;min-width:0}
.ord b{font-size:15px}
.ord span span{font-size:12px}
.ord .ot>span{font-size:12px;color:var(--muted)}
.ord .c{font-family:var(--f-mono);font-weight:700;color:var(--alarm)}
.ord .c.free{color:var(--ok)}
.consult{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.cons{display:flex;align-items:center;gap:9px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:5px 10px 5px 5px}
.cons:hover:not(:disabled){border-color:var(--scrub)}
.cons:disabled{opacity:.5;cursor:not-allowed}
.cons b{font-size:13px;display:block}
.cons small{font-size:12px;color:var(--muted)}

.dx{padding:14px}
.dx h2{font-size:18px;margin-bottom:8px}
.combo{position:relative;display:flex;gap:8px}
.combo input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink)}
.combo input:focus{border-color:var(--scrub);outline:none}
.list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:260px;overflow:auto;padding:4px}

.list small{color:var(--muted)}
.guesses{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.guesses li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:7px 10px;border-radius:8px;border:1px solid var(--line)}
.guesses li s{color:var(--muted);flex:1 1 140px;min-width:0}
.chip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.03em;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip .ic{width:12px;height:12px}
.chip.y{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.chip.n{background:var(--panel-2);color:var(--muted)}
.chip.u{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}
.tx{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.tx button{text-align:left;border:1.5px solid var(--line);background:var(--panel-2);border-radius:10px;padding:11px 13px;font-weight:700;display:flex;align-items:center;gap:10px}
.tx button .ic{color:var(--scrub);width:18px;height:18px}
.tx button:hover:not(:disabled){border-color:var(--scrub);background:var(--scrub-soft)}
.tx button:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.result{padding:16px}
.result h2{font-size:24px;margin:6px 0 4px}
.verdict{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.verdict .ic{width:18px;height:18px}
.verdict.good{color:var(--ok)} .verdict.bad{color:var(--alarm)} .verdict.meh{color:var(--amber)}
.bd{margin:12px 0;display:grid;grid-template-columns:1fr auto;gap:3px 16px;font-size:14px}
.bd span:nth-child(even){font-family:var(--f-mono);text-align:right}
.bd .tot{border-top:1px solid var(--line);padding-top:5px;font-weight:700}
.pearl{font-size:14px;background:var(--panel-2);border-radius:8px;padding:9px 11px;margin:10px 0}

/* break / over */
.center{max-width:880px;margin:10px auto;padding:22px}
.center h1{font-size:clamp(26px,4vw,38px)}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.perk{text-align:left;border:1.5px solid var(--line);background:var(--panel-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.perk:hover{border-color:var(--scrub);background:var(--scrub-soft)}
.perk b{font-family:var(--f-display);font-size:18px}
.pi,.tile{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--scrub)}
.pi .ic,.tile .ic{width:22px;height:22px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.sum{background:var(--panel-2);border-radius:10px;padding:10px 12px}
.sum b{display:block;font:700 22px/1.2 var(--f-mono)}
.overart{width:120px;height:auto;max-width:100%;float:right;margin:0 0 8px 12px}

/* gacha */
.req{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:16px;align-items:start}
@media (max-width:860px){.req{grid-template-columns:minmax(0,1fr)}}
.cabinet{padding:18px}
.cabinet h1,.pagehead h1{font-size:clamp(24px,3.4vw,32px)}
.cabinet p{color:var(--muted);max-width:62ch;margin:6px 0 0}
.cabwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.cab{width:150px;max-width:100%;height:auto;flex:none}
.cab.go .dw.hit{animation:drawerOut 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes drawerOut{35%{transform:translateY(5px) scale(1.06)}}
.cab .glow{opacity:0}
.cab.go .glow{animation:glow 1.2s ease-out both}
@keyframes glow{30%{opacity:.9}100%{opacity:0}}
.pullrow{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 6px;align-items:center}
.pullrow .btn{padding:12px 18px}
.pity{margin:10px 0 0;font-size:13px;color:var(--muted)}
.pity .bar{height:6px;border-radius:3px;background:var(--panel-2);margin-top:4px;overflow:hidden}
.pity .bar i{display:block;height:100%;background:var(--t4)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px}
.card{position:relative;border-radius:12px;padding:12px;min-height:150px;display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);background:var(--panel-2);animation:drawer .55s cubic-bezier(.2,.8,.2,1.2) both;text-align:left;font:inherit;color:inherit}
@keyframes drawer{from{transform:translateY(14px) scale(.96);opacity:0}}
.card .stars{font-size:13px;letter-spacing:1px}
.card b{font-family:var(--f-display);font-size:16px;line-height:1.2}
.card p{margin:0;font-size:12.5px;color:var(--muted)}
.card .tag{position:absolute;top:10px;right:10px;font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:4px;background:var(--scrub);color:var(--scrub-ink)}
.card.r0 .stars,.card.r0 .tile{color:var(--t0)}
.card.r1{border-color:var(--t2)} .card.r1 .stars,.card.r1 .tile{color:var(--t2)}
.card.r2{border-color:#8A5CC9;background:color-mix(in srgb,#8A5CC9 10%,var(--panel-2))} .card.r2 .stars,.card.r2 .tile{color:#8A5CC9}
.card.r3{border-color:var(--t4);background:color-mix(in srgb,var(--t4) 14%,var(--panel-2));box-shadow:0 0 0 3px color-mix(in srgb,var(--t4) 25%,transparent)} .card.r3 .stars,.card.r3 .tile{color:var(--t4)}
.rates{padding:16px;font-size:14px}
.rates table{width:100%;border-collapse:collapse;margin-top:6px}
.rates td{padding:5px 0;border-bottom:1px solid var(--line)}
.rates td:last-child{text-align:right;font-family:var(--f-mono)}
.rates ul{padding-left:18px;margin:10px 0 0;color:var(--muted);font-size:13px}

/* loadout & casebook */
.pagehead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0 18px}

.slot{min-height:120px;border:1.5px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:8px}
.slot .card{width:100%;min-height:110px;animation:none;cursor:pointer}
.owned{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.owned .card{animation:none;cursor:pointer}
.owned .card.eq{outline:2.5px solid var(--scrub);outline-offset:2px}
.owned .card.locked{opacity:.45;cursor:default;border-style:dashed}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:12px}
.entry{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:5px;min-width:0}
.entry.unk{background:transparent;border-style:dashed;color:var(--muted)}
.entry b{font-size:14px;display:flex;align-items:center;gap:6px}
.entry .ic{color:var(--scrub)} .entry.unk .ic{color:var(--muted)}
.entry small{color:var(--muted);font-size:12px}

/* staff room */
.room{padding:0;overflow:hidden}
.room svg{display:block;width:100%;height:auto}
.talk{display:flex;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.talk .avatar{width:64px;height:64px;margin:0}
.talk p{margin:0;font-size:16px;max-width:70ch}
.talk q{quotes:"\201C" "\201D"}
.staffgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.staff{padding:14px;display:flex;flex-direction:column;gap:8px}
.staff header{display:flex;gap:12px;align-items:center}
.staff header .avatar{width:58px;height:58px;margin:0}
.staff h3{font-size:17px}
.staff .role{font-size:13px;color:var(--muted)}
.hearts{display:flex;gap:3px;color:var(--alarm)}

.abil b{display:block}
.staff .row{display:flex;gap:8px;flex-wrap:wrap}

/* menu */
.menu{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:center;min-height:calc(100vh - 80px);padding-block:20px}
@media (max-width:860px){.menu{grid-template-columns:minmax(0,1fr);min-height:0}}
.logo{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,8vw,86px);line-height:.95;letter-spacing:-.04em;margin:0}
.logo span{display:inline-block;padding-bottom:14px;background:repeating-linear-gradient(115deg,var(--ink) 0 9px,transparent 9px 18px) left bottom/100% 10px no-repeat}
.tagline{font-size:18px;color:var(--muted);max-width:44ch;margin:14px 0 22px}
.menubtns{display:flex;flex-direction:column;gap:10px;max-width:380px}
.menubtns .btn{justify-content:flex-start;padding:13px 16px;font-size:16px}
.menubtns .btn small{margin-left:auto;font-weight:400;color:inherit;opacity:.75;font-size:12px}
.menuart{width:100%;height:auto;border-radius:16px;display:block}
.blink-r{animation:lightR 1s steps(2,end) infinite} .blink-b{animation:lightR 1s steps(2,end) infinite reverse}
@keyframes lightR{50%{opacity:.25}}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}
.slotcard{padding:14px;display:flex;flex-direction:column;gap:10px}
.slotcard header{display:flex;gap:12px;align-items:center}
.slotcard .avatar{width:60px;height:60px;margin:0}
.slotcard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:13px}
.slotcard dt{color:var(--muted)} .slotcard dd{margin:0;font-family:var(--f-mono)}
.slotcard.empty{border-style:dashed;align-items:flex-start;justify-content:center;min-height:180px;color:var(--muted)}
.code{width:100%;min-height:90px;font:12px/1.4 var(--f-mono);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);resize:vertical}
.helpl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:70ch}

/* character creator */
.create{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.create{grid-template-columns:minmax(0,1fr)}}
.preview{padding:20px;text-align:center;position:sticky;top:16px}
.preview .avatar{width:180px;height:180px;margin:0 auto 12px;display:block}
.preview h2{font-size:24px}
.form{padding:18px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:8px}
.field input[type=text]{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink);max-width:360px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--panel-2);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--scrub);background:var(--scrub-soft)}
.optcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.optcard{text-align:left;border:1.5px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.optcard[aria-pressed="true"]{border-color:var(--scrub);background:var(--scrub-soft)}
.optcard span{font-size:13px;color:var(--muted)}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--scrub);outline-offset:2px}

/* emergency */
.emov{position:fixed;inset:0;z-index:40;background:rgba(30,6,6,.66);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.emcard{width:min(1000px,100%);background:var(--panel);border-radius:16px;border:3px solid var(--alarm);box-shadow:0 0 0 0 rgba(229,72,77,.5);animation:empulse 1.4s infinite;overflow:hidden}
.emcard.done{animation:none}

.emhead{background:var(--alarm);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:14px}
.emhead h2{font-size:clamp(18px,3vw,26px);letter-spacing:.02em}
.emhead p{margin:0;font-size:13px;opacity:.9}
.ring{margin-left:auto;position:relative;width:62px;height:62px;flex:none}
.ring svg{width:62px;height:62px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 18px var(--f-mono)}
.embody{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;padding:14px}

.emclues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}

.emopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}

.emopts button{text-align:left;border:1.5px solid var(--line);background:var(--panel-2);border-radius:10px;padding:11px 12px;font-weight:700}
.emopts button:hover:not(:disabled){border-color:var(--alarm)}
.emopts button:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.arrive{display:flex;align-items:center;justify-content:center;min-height:120px;font-family:var(--f-display);font-size:24px;font-weight:800;color:var(--alarm);animation:blink 0.8s steps(2,end) infinite}
.hurry .ring b{color:#FFE27A}

.warnc{color:var(--alarm)}
.fb-btns{margin-left:auto;display:flex;gap:8px}
.pausebar{background:var(--amber);color:#1b1404;font-weight:700;padding:8px 14px;border-radius:10px;margin:-6px 0 14px}
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.bedcard{position:relative;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
button.bedcard{cursor:pointer}
button.bedcard:hover{border-color:var(--scrub)}
.bedcard header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.bedcard.empty{border-style:dashed;opacity:.85}

.bedcard.crit{border-color:var(--alarm);box-shadow:0 0 0 3px color-mix(in srgb,var(--alarm) 25%,transparent)}
.bedcard.warn{border-color:var(--amber)}
.bedcard.new{border-color:var(--scrub)}

.esi{font-size:11px;font-weight:800;letter-spacing:.04em;color:#fff;background:var(--esi);padding:2px 8px;border-radius:99px;white-space:nowrap}
.bcwho{display:flex;align-items:baseline;gap:8px}

.bccc{margin:0;font-size:14px;display:flex;gap:6px;align-items:flex-start}
.bccc .ic{color:var(--scrub);margin-top:2px}
.sbar{height:7px;border-radius:4px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.sbar i{display:block;height:100%;background:var(--ok)}
.sbar i.mid{background:var(--amber)}.sbar i.low{background:var(--alarm)}
.bcst{margin:0;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center}
.bedcard.crit .bcst{color:var(--alarm);animation:blink 1s steps(2,end) infinite}
.bcvit{margin:0;font-size:12px;color:var(--muted)}
.waiting{padding:12px 14px;margin-top:14px}
.waiting header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.waiting h3{font-size:16px;display:flex;gap:8px;align-items:center}
.wq{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}

.wchip>div{flex:1;min-width:0}
.wchip b{display:block;font-size:13px}.wchip span{font-size:12px;color:var(--muted)}
.wchip .esi{color:#fff}
.wt{font-size:12px}
.bedstrip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.bs{border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:4px 10px;font-weight:700;font-size:13px;display:flex;flex-direction:column;line-height:1.15;text-align:left}
.bs small{font-weight:400;color:var(--muted);font-size:11px}
.bs.cur{border-color:var(--scrub);background:var(--scrub-soft)}
.bs.crit{border-color:var(--alarm);color:var(--alarm)}.bs.warn{border-color:var(--amber)}

.fbclock{margin-left:auto;font-size:18px;font-weight:700}
.procs{display:flex;flex-direction:column;gap:8px;margin-top:8px}

.dispo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}

.arrestp{padding:16px;border:2px solid var(--alarm);animation:empulse 1.4s infinite}

/* procedures & CPR overlay */
.emov.minov{z-index:55;background:rgba(10,20,22,.7)}
.minicard{width:min(560px,100%);padding:18px;display:flex;flex-direction:column;gap:10px}
.minihead{display:flex;gap:12px;align-items:center;color:var(--scrub)}
.minihead .ic{width:30px;height:30px}
.minihead h2{font-size:22px;color:var(--ink)}
.minimsg{margin:0;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--amber) 20%,transparent);font-weight:700}
.scope svg{width:100%;max-width:300px;display:block;margin:0 auto}
.track{position:relative;height:26px;border-radius:13px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}

// Two random numbers make one name, so seeded patients (Case of the day, challenges) use the same draws as before.
function nameFrom(sex,u1,u2){
  const n=NAME_SETS.length,k=Math.min(n-1,Math.floor(u1*n)),c=NAME_SETS[k],firsts=sex==='M'?c.m:c.f;
  const first=firsts[Math.min(firsts.length-1,Math.floor((u1*n-k)*firsts.length))],fam=c.l[Math.min(c.l.length-1,Math.floor(u2*c.l.length))].split('/');
  return first+' '+(sex==='M'?fam[0]:fam[1]||fam[0]);
}
const randName=sex=>nameFrom(sex,Math.random(),Math.random());

// Cases a special guest can arrive with, limited to what this shift can already roll

  return CAMEO_PT.filter(c=>IDX[c.d]!=null&&!r.cameos.includes(c.id)&&!(S.meta.camRecent||[]).includes(c.id)&&!seenLately(c.d)&&D[IDX[c.d]].t<=maxT&&(!emerg||EMERG.has(c.d)));

const curP=()=>S.run&&S.sel!=null?S.run.beds[S.sel]:null;

function treat(opt){
  const p=curP();if(!p||p.phase!=='treat'||p.txWrong.includes(opt))return;const d=D[p.d];
  if(opt===d.tx){sfx('push');p.phase=p.procs.length?'proc':'dispo';if(p.procs.length)toast('Treatment started. Bedside procedures needed.');save();render();return}
  const pen=Math.max(0,3-mods().txPen);
  p.txWrong.push(opt);p.wrongTx++;p.stab-=pen;sfx('wrong');
  toast(pen?'The patient is getting worse. Rethink the treatment.':'Wrong treatment, but no harm done. Try again.');
  if(p.stab<=0)arrest(S.sel);
  save();render();
}
function arrest(i){
  const r=S.run,p=r.beds[i];if(!p||p.phase==='arrest'||p.phase==='dead')return;
  const m=mods();
  p.prev=p.phase==='done'?'dispo':p.phase;p.phase='arrest';p.arrestT=25+m.arrestBonus;p.stab=0;
  p.rhythm=(['stemi','brugada','peaked','afib','osborn'].includes(D[p.d].ecg)||Math.random()<.35)?'vfib':'asystole';
  r.streak=0;r.crashes++;sfx('alarm');
  if(m.autoRosc&&!r.autoRoscUsed){
    r.autoRoscUsed=true;p.phase=p.prev&&p.prev!=='arrest'?p.prev:'case';p.stab=3;p.rosc=true;p.decay=0;r.saves++;
    toast(`Bay ${i+1} arrested. The rapid response team got a pulse back.`);return;
  }
  toast(`Bay ${i+1}: CARDIAC ARREST. Start CPR now.`);
}

function dispo(code){
  const r=S.run,p=curP();if(!p||p.phase!=='dispo')return;const d=D[p.d],right=d.dispo;
  const m=mods();
  let f=1,label='Right destination',repLoss=0;
  if(code===right){}
  else if(code==='home'){f=.3;label='Unsafe discharge';repLoss=m.safeDischarge?0:1;if(m.safeDischarge)label='Unsafe discharge (the Bed Manager called them back)'}
  else if(right==='home'){f=.7;label='Unnecessary admission'}
  else if(code==='ward'){f=.6;label='Needed a higher level of care'}
  else{f=.8;label='Wrong destination'}
  if(m.dispoHalf&&f<1)f=+(1-(1-f)/2).toFixed(2);
  const bd=pointsBreakdown(p,f,label);
  const grant=Math.floor(bd.total/GRANT_DIV*(1+m.grant));
  r.score+=bd.total;r.earned+=grant;S.meta.grant+=grant;r.treated++;
  if(d.t>r.rarest){r.rarest=d.t;r.rarestName=d.n}
  if(repLoss){
    r.rep--;r.streak=0;
    const b=JSON.parse(JSON.stringify(p));
    Object.assign(b,{id:r.nid++,phase:'case',turned:true,defused:false,stab:4,guesses:[],tx:null,txWrong:[],wrongTx:0,procDone:[],procFails:0,out:null,bounce:true,wait:0,decay:0,caught:false,rosc:false,bay:0});
    r.queue.unshift(b);
    toast(p.name+' will be back by ambulance. Unsafe discharge.');
  }else r.streak++;
  sfx('door');if(grant)setTimeout(()=>sfx('coin'),350);
  p.phase='done';p.doneT=0;p.out={kind:code===right?'good':'meh',pick:code,right,bd,pts:bd.total,grant,label};
  logCase({k:'treated',n:d.n,name:p.name,wrong:p.guesses.filter(g=>!g.ok).map(g=>g.n),wrongTx:p.wrongTx,procFails:p.procFails,pick:code,right,rosc:!!p.rosc,missed:!!(p.masked&&p.turned&&!p.caught)});achEvent('dispo',{right:code===right,unsafe:!!repLoss,dest:right});
  if(r.rep<=0){endRun();return}
  save();render();
}
function pointsBreakdown(p,f,label){
  const r=S.run,d=D[p.d],m=mods();
  const rows=[];let v=TIERS[d.t].pts;rows.push([TIERS[d.t].k+' case',fmt(v)]);
  const eff=1+.08*Math.max(0,p.stab);v*=eff;rows.push(['Stability left ('+Math.max(0,p.stab)+')','×'+eff.toFixed(2)]);
  const sm=1+.2*(Math.min(r.shift,6)-1);if(sm>1){v*=sm;rows.push(['Shift '+r.shift,'×'+sm.toFixed(1)])}
  if(p.grand){v*=1.5;rows.push(['Grand Rounds','×1.5'])}
  if(p.caught){v*=1.5;rows.push(['Caught before it turned','×1.5'])}
  if(p.cam){v*=1.25;rows.push(['Special guest','×1.25'])}
  if(d.t===0&&m.common){v*=1+m.common;rows.push(['Generalist bonus','+'+Math.round(m.common*100)+'%'])}
  const bonus=m.score+Math.min(r.streak,5)*.1;if(Math.abs(bonus)>.001){v*=1+bonus;rows.push(['Streak, perks, difficulty & tools',(bonus>0?'+':'')+Math.round(bonus*100)+'%'])}
  if(d.t>=2&&m.rare){v*=1+m.rare;rows.push(['Rare-case bonus','+'+Math.round(m.rare*100)+'%'])}
  if(d.t>=3&&m.zebra>1){v*=m.zebra;rows.push(['Zebra multiplier','×'+(+m.zebra.toFixed(2))])}
  if(p.wrongTx){const k=Math.pow(.6,p.wrongTx);v*=k;rows.push(['Wrong treatments ('+p.wrongTx+')','×'+k.toFixed(2)])}
  if(p.procFails){const k=Math.pow(.85,p.procFails);v*=k;rows.push(['Failed procedure attempts','×'+k.toFixed(2)])}
  if(p.rosc){v*=.7;rows.push(['Needed CPR','×0.7'])}
  if(f!==1){v*=f;rows.push([label,'×'+f])}
  return{rows,total:Math.round(v/10)*10};
}

function liveVitals(p){
  const d=D[p.d];let[hr,bp,rr,sp,t]=hidden(p)?MASK[d.n].v:d.v;let[sys,dia]=bp.split('/').map(Number);
  if(p.phase==='arrest')return{hr:p.rhythm==='vfib'?'VF':0,bp:'--/--',rr:0,sp:'--',t,rhythm:p.rhythm};
  if(p.phase==='dead'||(p.out&&p.out.kind==='crash'))return{hr:0,bp:'--/--',rr:0,sp:'--',t,rhythm:'asystole'};
  if(p.phase==='done'||(p.out&&p.out.kind==='good'))return{hr:78,bp:'122/76',rr:14,sp:98,t:37.0,rhythm:'sinus'};
  const k=Math.max(0,.55-p.stab/p.max);
  if(k>0){hr=hr<60?Math.max(30,hr-Math.round(k*30)):hr+Math.round(k*45);sys-=Math.round(k*40);dia-=Math.round(k*22);rr+=Math.round(k*14);sp=Math.max(70,sp-Math.round(k*16))}
  return{hr,bp:sys+'/'+dia,rr,sp,t,rhythm:d.ecg};
}

function floorBrief(){
  const r=S.run;if(!r||r.phase!=='floor')return'The shift is between handovers; no patients are waiting.';
  const rows=r.beds.map((p,i)=>{
    if(!p)return null;const d=D[p.d],cc=hidden(p)?MASK[d.n].cc:d.cc,who=`${p.age}-year-old ${p.sex==='M'?'man':'woman'}`;
    if(p.phase==='dead')return`Bay ${i+1}: ${who}, died tonight (${d.n}).`;
    if(p.phase!=='case'&&p.phase!=='arrest')return`Bay ${i+1}: ${who}, already diagnosed with ${d.n} and being treated.`;
    const cl=[];['h','e','l','i'].forEach(c=>{for(let k=0;k<p.rev[c];k++)cl.push(d[c][k])});
    const no=p.guesses.filter(g=>!g.ok).map(g=>g.n);

  if(co.length){cam=pick(co);di=IDX[cam.d];r.cameos.push(cam.id);camSeen(cam.id)}
  else if(Math.random()<.15)di=freshPick(FAKE,'fake');

    di=freshPick(pool,key);

    phase:'alert',el:0,pen:0,dur:Math.max(25,45+m.emTime+extra+(d.proc.length?12:0)),wrong:[],opts:ddxFor(di),tx:shuffle([d.tx,...shuffle(d.w).slice(0,2)]),res:null,procDone:[]};

// Six options that a real clinician would weigh together: curated differentials, the case's mimic, then same and neighbouring systems
function ddxFor(di){
  const d=D[di],out=[];
  const add=i=>{if(i!=null&&i!==di&&!out.includes(i)&&out.length<5)out.push(i)};
  (DDX[d.n]||[]).forEach(n=>add(IDX[n]));
  if(d.mim)add(IDX[d.mim]);
  D.forEach((x,i)=>{if(x.mim===d.n)add(i)});
  const rest=shuffle(D.map((x,i)=>i).filter(i=>i!==di&&!out.includes(i)));
  rest.filter(i=>D[i].s===d.s&&EMERG.has(D[i].n)).forEach(add);
  rest.filter(i=>D[i].s===d.s).forEach(add);
  rest.filter(i=>(REL[d.s]||[]).includes(D[i].s)).forEach(add);
  rest.forEach(add);
  return shuffle([di,...out]);
}

function emClues(d){return[['e',d.e[0]],['l',d.l[0]],['h',d.h[0]],['i',d.i[0]],['e',d.e[1]],['h',d.h[1]],['l',d.l[1]]].filter(x=>x[1])}

// Advance the ER floor: arrivals, deterioration, masked cases turning, arrests, waiting room
function worldTick(dt){
  const r=S.run;let changed=false;
  r.clock+=dt;
  while(r.beds.length<bedCount()){r.beds.push(null);changed=true}
  if(r.arrived<r.toArrive&&!r.tut){r.spawnT+=dt;if(r.spawnT>=r.nextGap){r.spawnT=0;r.nextGap=spawnGap(r.shift);spawn();changed=true}}
  r.beds.forEach((p,i)=>{
    if(!p)return;
    if(p.phase==='done'||p.phase==='dead'){p.doneT+=dt;if(p.doneT>(p.phase==='dead'?14:10)&&S.sel!==i){r.beds[i]=null;changed=true}return}
    if(p.phase==='arrest'){p.arrestT-=dt;if(p.arrestT<=0){patientDies(i,'No CPR was started in time.');changed=true}return}
    if(hidden(p)){if(!p.defused&&MASK[D[p.d].n].turn!=='none'){p.maskT-=dt;if(p.maskT<=0){turnPatient(i);changed=true}}return}
    const iv=decayInterval(p);
    if(iv){p.decay+=dt;while(p.decay>=iv){p.decay-=iv;p.stab--;changed=true}if(p.stab<=0){arrest(i);changed=true}}
  });
  const limit=up('triage')?240:150,stay=!!(r.buff&&r.buff.noLWBS);
  for(let k=r.queue.length-1;k>=0;k--){
    const p=r.queue[k];p.wait+=dt;
    if(!up('triage')){const iv=decayInterval(p);if(iv){p.decay+=dt/2;while(p.decay>=iv){p.decay-=iv;if(p.stab>2){p.stab--;changed=true}}}}
    if(!stay&&p.wait>limit&&acuity(p)>=3&&!p.bounce){r.queue.splice(k,1);r.lwbs++;logCase({k:'lwbs',n:D[p.d].n,name:p.name});r.streak=0;toast(p.name+' left without being seen.');changed=true}
  }
  const before=r.beds.filter(Boolean).length;fillFromQueue();if(r.beds.filter(Boolean).length!==before)changed=true;
  if(checkShiftEnd())changed=true;
  if(r.rep<=0){endRun();return true}
  return changed;
}

function noiseBuf(ctx,kind){

  v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+att);v.gain.exponentialRampToValueAtTime(.0001,t+dur);

function ambPad(A,f,t,len){

    v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.0055,t+2.4);v.gain.setValueAtTime(.0055,t+len-2.6);v.gain.linearRampToValueAtTime(0,t+len);

function ambSchedule(A){
  const now=A.ctx.currentTime,h=now+.6,N=A.next;
  for(const k in N)if(N[k]<now-.5)N[k]=now+.1+Math.random()*.4;
  while(N.beep<h){if(Math.random()<.85)ambTone(A,{f:965,t:N.beep,dur:.09,g:.007,to:[A.far]});N.beep+=.92+Math.random()*.12}
  while(N.pump<h){for(let k=0;k<3;k++)ambTone(A,{f:620,t:N.pump+k*.28,dur:.14,g:.006,type:'triangle',to:[A.far]});N.pump+=22+Math.random()*30}

function ambStart(){
  if(AUD.amb)return;const ctx=audioCtx();if(!ctx)return;
  try{
    const out=ctx.createGain();out.gain.setValueAtTime(0,ctx.currentTime);out.gain.linearRampToValueAtTime(.85,ctx.currentTime+3);out.connect(ctx.destination);
    const verb=ctx.createConvolver();verb.buffer=impulse(ctx,2.8);const wet=ctx.createGain();wet.gain.value=.35;verb.connect(wet);wet.connect(out);
    const mus=ctx.createBiquadFilter();mus.type='lowpass';mus.frequency.value=1500;mus.connect(out);mus.connect(verb);
    const farF=ctx.createBiquadFilter();farF.type='lowpass';farF.frequency.value=2200;farF.connect(out);farF.connect(verb);
    const hv=ctx.createBufferSource();hv.buffer=noiseBuf(ctx,'brown');hv.loop=true;const hf=ctx.createBiquadFilter();hf.type='lowpass';hf.frequency.value=260;const hg=ctx.createGain();hg.gain.value=.05;hv.connect(hf);hf.connect(hg);hg.connect(out);hv.start();

  }catch(e){AUD.amb=null}
}

function sTone(f,dur,{type='sine',g=.05,at=0,to=null,att=.005}={}){

  o.connect(v);v.connect(c.destination);o.start(t);o.stop(t+dur+.05);

function sNoise(dur,{g=.08,at=0,type='bandpass',f=1000,q=1,to=null,att=.004}={}){

  fl.type=type;fl.frequency.setValueAtTime(f,t);fl.Q.value=q;if(to)fl.frequency.exponentialRampToValueAtTime(to,t+dur);
  v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+att);v.gain.exponentialRampToValueAtTime(.0001,t+dur);

function miniLoop(){
  const o=S.mini;if(!o)return;const t=nowT(o);
  if(o.type==='timing'){const off=cordOff(o),g=$('#cords');if(g){g.setAttribute('transform',`translate(${(off*60).toFixed(1)} 0)`);g.classList.toggle('aligned',Math.abs(off)<=o.tol)}}
  if(o.type==='pulse'){
    const per=60/o.tempo,since=t-o.lead,next=since<0?-since:per-(since%per),k=Math.min(1,next/per);
    const ring=$('#ring');if(ring){ring.setAttribute('r',(12+46*k).toFixed(1));ring.setAttribute('opacity',(.3+.7*(1-k)).toFixed(2))}
    const ph=since<0?.5:(since%per)/per,c=$('#pulse');if(c)c.setAttribute('r',(12*(1+.35*Math.exp(-Math.pow(ph/.08,2))+.35*Math.exp(-Math.pow((1-ph)/.08,2)))).toFixed(1));
  }
  if(o.type==='seq'&&o.stage==='us'){const a=$('#art');if(a){const per=60/Math.max(60,Math.min(110,o.hr||80)),ph=(t%per)/per;a.setAttribute('r',(12*(1+.28*Math.exp(-Math.pow(ph/.1,2)))).toFixed(1))}}
  if(o.limit){const b=$('#mbar');if(b)b.style.width=Math.max(0,100-t/o.limit*100)+'%';if(t>=o.limit){miniDone(false,'Out of time.');return}}
  requestAnimationFrame(miniLoop);
}
function miniPenalty(n){
  const o=S.mini;
  if(o.ctx.kind==='em'){S.run.em.pen+=n*3;return}
  const p=S.run.beds[o.ctx.bed];if(!p)return;p.stab-=n;
  if(p.stab<=0){S.mini=null;$('#mini').innerHTML='';arrest(o.ctx.bed);save();render()}
}
function miniFlash(msg,good){const m=$('#minimsg');if(m){m.textContent=msg;m.className='minimsg'+(good?' good':'');m.hidden=false}}
function miniAct(){
  const o=S.mini;if(!o)return;const t=nowT(o);
  if(o.type==='timing'){
    sfx('whoosh');
    if(Math.abs(cordOff(o))<=o.tol){setTimeout(()=>sfx('breath'),350);miniDone(true);return}
    sfx('miss');o.tries++;miniPenalty(1);if(!S.mini)return;
    if(o.tries>=3){miniDone(false,'Failed airway. Anaesthetics had to take over.');return}
    o.msg='Missed: oesophageal. Wait for green.';renderMini();
  }else if(o.type==='pulse'){
    const per=60/o.tempo,since=t-o.lead;
    if(since<-o.win){miniFlash('Wait for the first beat.');return}
    const k=Math.round(since/per),d=since-k*per;
    if(k===o.judged){miniFlash('One tap per beat.');return}
    o.judged=k;
    sfx('prick');
    if(Math.abs(d)<=o.win){sfx('flash');o.hits++;if(o.hits>=3){miniDone(true);return}miniFlash('Flash of blood. '+(3-o.hits)+' more.',true)}
    else{o.hits=Math.max(0,o.hits-1);miniFlash(d<0?'Too early.':'Too late.')}
    const pp=$('#pips');if(pp)pp.innerHTML=pipsHTML(o);
  }
}
function cvcUS(which){

  o.tries++;miniPenalty(1);if(!S.mini)return;

function miniDone(ok,msg){

  if(o.ctx.kind==='em'){
    const e=S.run.em;if(!e||e.phase!=='proc')return;
    if(ok){e.procDone.push(o.id);toast(P.n+' done.');if(D[e.d].proc.every(x=>e.procDone.includes(x))){emFinish(true,'tx');return}}

}

/* ===================== CPR ===================== */
function startCPR(){
  const p=curP();if(!p||p.phase!=='arrest')return;
  S.cpr={bed:S.sel,stage:'ready',cycle:1,t:0,taps:[],q:[],rhythm:p.rhythm,choice:null,rosc:null,last:performance.now()};renderCPR();
}
function cprRate(){const t=S.cpr.taps;if(t.length<3)return 0;const iv=[];for(let k=Math.max(1,t.length-5);k<t.length;k++)iv.push(t[k]-t[k-1]);return Math.round(60/(iv.reduce((a,b)=>a+b,0)/iv.length))}
function cprTap(){
  const c=S.cpr;if(!c||c.stage!=='cpr')return;
  c.taps.push(c.t);sfx('thump');const ch=$('#chest');if(ch){ch.classList.remove('press');void ch.offsetWidth;ch.classList.add('press')}
  const n=$('#cprn');if(n)n.textContent=c.taps.length;
}
function cprLoop(ts){
  const c=S.cpr;if(!c||c.stage!=='cpr')return;
  const dt=Math.min(.05,(ts-c.last)/1000);c.last=ts;c.t+=dt;
  const rate=cprRate(),r=$('#cprrate'),nd=$('#needle'),bar=$('#cprbar');
  if(r)r.textContent=rate||'—';if(nd)nd.style.left=Math.max(0,Math.min(100,(rate-60)))+'%';if(bar)bar.style.width=Math.min(100,c.t/10*100)+'%';
  if(r)r.className=rate>=100&&rate<=120?'good':rate?'off':'';
  if(c.t>=10){
    const iv=[];for(let k=1;k<c.taps.length;k++)iv.push(c.taps[k]-c.taps[k-1]);
    const good=iv.filter(x=>{const b=60/x;return b>=98&&b<=126}).length;
    let q=Math.min(1,good/16);if(up('lucas'))q=Math.max(q,.6);c.q.push(q);
    // A short hands-off pause stops a compression tap from landing on the next button
    if(c.cycle===1){c.stage='check';c.unlock=performance.now()+1600}
    else{
      const avg=c.q.reduce((a,b)=>a+b,0)/c.q.length,correct=(c.rhythm==='vfib')===(c.choice==='shock');
      const b=S.run.buff||{},bonus=b.rosc||0;b.rosc=0;
      const prob=Math.max(.05,Math.min(.95,.1+.55*avg+(correct?.3:-.1)+mods().rosc+bonus));
      c.rosc=Math.random()<prob;c.prob=prob;c.correct=correct;c.avg=avg;c.stage='result';c.unlock=performance.now()+1200;sfx(c.rosc?'right':'flat');
    }
    renderCPR();
    const lockFor=c.unlock-performance.now();
    setTimeout(()=>{if(S.cpr!==c)return;document.querySelectorAll('[data-cpr],[data-act="cprdone"]').forEach(b=>b.disabled=false);const l=$('#cprlock');if(l)l.textContent=c.stage==='check'?'Read the rhythm, then choose.':''},Math.max(0,lockFor));
    return;
  }
  requestAnimationFrame(cprLoop);
}
function renderCPR(){
  const c=S.cpr,el=$('#mini');if(!c){el.innerHTML='';return}
  const p=S.run.beds[c.bed];let body='';
  if(c.stage==='ready')body=`<p>Push hard and fast in the centre of the chest: <b>100–120 compressions a minute</b>. Tap the button or press <b>Space</b> on every compression. Two 10-second cycles with a rhythm check in between.${up('lucas')?' The mechanical CPR device keeps quality at 60% or better.':''}</p><button class="btn primary big" data-act="cprgo">${ic('heart')}Start compressions</button>`;
  else if(c.stage==='cpr')body=`<div class="cprwrap"><svg id="chest" class="chest" viewBox="0 0 160 110" aria-hidden="true"><ellipse cx="80" cy="70" rx="70" ry="34" fill="#E1B48C"/><path d="M60 52h40v22H60z" fill="#d9a77d"/><circle cx="80" cy="62" r="9" fill="#c98f62"/></svg>
    <div class="cprstats"><div><span class="label">Rate / min</span><b id="cprrate">—</b></div><div><span class="label">Compressions</span><b id="cprn">${c.taps.length}</b></div></div></div>
    <div class="gauge"><span class="gz"></span><span class="needle" id="needle"></span><span class="gl">60</span><span class="gr2">160</span></div>
    <div class="cbar"><i id="cprbar"></i></div><button class="btn primary big cprbtn" data-act="cprtap">Compress</button><p class="hint">Cycle ${c.cycle} of 2</p>`;
  else if(c.stage==='check'){const locked=performance.now()<(c.unlock||0);
    body=`<div class="cprchoice">${[['shock','bolt','Shockable','Deliver a 200 J shock, then resume CPR'],['noshock','syringe','Not shockable','Give adrenaline 1 mg, then resume CPR']].map(([k,i,b,s])=>`<button class="${k}" data-cpr="${k}" ${locked?'disabled':''}>${ic(i)}<b>${b}</b><span>${s}</span></button>`).join('')}</div>

    <div class="monitor"><canvas class="ecg" data-rhythm="${c.rhythm}" data-hr="0"></canvas></div>
    <p class="hint" style="margin:0"><b>Rhythm check.</b> Compressions paused. Cycle 1 quality: ${Math.round(c.q[0]*100)}%.</p>`}
  else{const locked=performance.now()<(c.unlock||0);body=`<button class="btn primary" data-act="cprdone" ${locked?'disabled':''}>${c.rosc?'Back to the patient':'Continue'}</button>
    <span class="verdict ${c.rosc?'good':'bad'}">${ic(c.rosc?'check':'x')}${c.rosc?'Pulse is back (ROSC)':'Resuscitation unsuccessful'}</span>
    <div class="bd"><span>Average CPR quality</span><span>${Math.round(c.avg*100)}%</span><span>Rhythm decision</span><span>${c.correct?'Correct':'Wrong'} (${c.rhythm==='vfib'?'VF, shockable':'asystole, not shockable'})</span><span>Chance of ROSC</span><span>${Math.round(c.prob*100)}%</span></div>`}
  el.innerHTML=`<div class="emov minov"><div class="panel minicard cpr"><div class="minihead" style="color:var(--alarm)">${ic('heart')}<div><span class="label">Bay ${c.bed+1} · ${p?esc(p.name):''}</span><h2>Cardiac arrest: CPR</h2></div></div>${body}</div></div>`;
  if(c.stage==='cpr'){c.last=performance.now();requestAnimationFrame(cprLoop)}
}
function cprDone(){
  const c=S.cpr,r=S.run,p=r.beds[c.bed];S.cpr=null;$('#mini').innerHTML='';
  if(!p){render();return}
  if(c.rosc){p.phase=p.prev&&p.prev!=='arrest'?p.prev:'case';p.stab=3;p.rosc=true;p.decay=0;r.saves++;achEvent('rosc');toast('ROSC. Keep going: find out why they arrested.')}

function buyUpg(id){

/* ===================== GACHA ===================== */
function rollRarity(){
  S.meta.pity++;
  if(S.meta.pity>=PITY){S.meta.pity=0;return 3}
  const x=Math.random()*100;
  const r=x<RATES[3]?3:x<RATES[3]+RATES[2]?2:x<RATES[3]+RATES[2]+RATES[1]?1:0;
  if(r===3)S.meta.pity=0;
  return r;
}
function grantTool(r){
  const t=pick(TOOLS.filter(x=>x.r===r)),o=S.meta.owned[t.id];
  let tag;
  if(!o){S.meta.owned[t.id]={lv:1};tag='NEW';if(S.meta.loadout.length<4)S.meta.loadout.push(t.id)}
  else if(o.lv<5){o.lv++;tag='LV '+o.lv}
  else{S.meta.grant+=30;tag='+30'}
  return{id:t.id,tag};
}
let justPulled=false;
function pull(n){
  const price=n===10?PULL10:PULL;
  if(S.meta.grant<price)return;
  S.meta.grant-=price;
  const rs=[];for(let i=0;i<n;i++)rs.push(rollRarity());
  if(n===10&&Math.max(...rs)<2)rs[9]=2;
  S.meta.lastPull=rs.map(grantTool);achEvent('pull',{n,best:Math.max(...rs)});save();render();
  if(reduced){sfx('drawer');sfx('jingle',Math.max(...rs));if(Math.max(...rs)===3)toast('Legendary requisition approved!')}
  else pyxPlay(S.meta.lastPull);
}

function renderShift(){

function bedStatus(p){
  if(p.phase==='arrest')return['CARDIAC ARREST: start CPR','heart','crit'];
  if(p.phase==='dead')return['Deceased','x','crit'];
  if(p.phase==='done')return['Transferring: '+DISPO_NAME[p.out.pick].toLowerCase(),'check','ok'];
  if(p.phase==='treat')return['Diagnosed: choose treatment','pill','warn'];
  if(p.phase==='proc')return['Procedure needed: '+p.procs.filter(x=>!p.procDone.includes(x)).map(x=>PROCS[x].n).join(', '),'syringe','warn'];
  if(p.phase==='dispo')return['Treated: decide where they go','door',''];
  if(p.stab/p.max<=.35)return['Deteriorating!','alert','crit'];
  const n=p.rev.h+p.rev.e+p.rev.l+p.rev.i+p.guesses.length;

}

function debriefIssues(log){
  const out=[];
  log.forEach(x=>{const d=D[IDX[x.n]];
    if(x.k==='death')out.push({who:'halvorsen',t:`${x.name} died with ${x.n}. ${x.reason}${x.wrong&&x.wrong.length?' You had called it '+x.wrong.join(', ')+'.':''}`,p:d&&d.p});
    else if(x.k==='lwbs')out.push({who:'rosa',t:`${x.name} left the waiting room without being seen. It was ${x.n}.`});
    else if(x.k==='em-fail')out.push({who:'halvorsen',t:`Emergency, ${x.name}: ${x.n}. ${x.reason==='timeout'?'We ran out of time.':'The treatment was wrong.'}${x.wrongCalls.length?' First call: '+x.wrongCalls.join(', ')+'.':''}`,p:d&&d.p});

    else if(x.k==='treated'){
      const parts=[];
      if(x.wrong.length)parts.push(`you guessed ${x.wrong.join(', ')} first`);
      if(x.wrongTx)parts.push(`${x.wrongTx} wrong treatment${x.wrongTx>1?'s':''} before the right one`);
      if(x.pick!==x.right)parts.push(`sent to ${DISPO_NAME[x.pick].toLowerCase()} when ${DISPO_NAME[x.right].toLowerCase()} was right`);
      if(x.missed)parts.push('it looked like a simple visit and crashed before you caught it');
      if(x.rosc)parts.push('the patient arrested and needed CPR');
      if(x.procFails)parts.push(`${x.procFails} failed procedure attempt${x.procFails>1?'s':''}`);
      if(parts.length)out.push({who:x.wrong.length&&d&&d.s==='Infectious'?'adaeze':x.wrongTx?'sam':x.pick!==x.right?'rosa':'halvorsen',t:`${x.name}, ${x.n}: ${parts.join('; ')}.`,p:(x.wrong.length||x.missed)&&d?d.p:null});
    }
  });

}

const DKEY='zebra-shift.daily',DAILY_MAX_WRONG=5;
let DAILY={};try{DAILY=JSON.parse(localStorage.getItem(DKEY)||'{}')||{}}catch(e){DAILY={}}

const dayStr=t=>t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
const todayStr=()=>dayStr(new Date());

const dailyClues=st=>st.rev.h+st.rev.e+st.rev.l+st.rev.i;
const dailyWrong=st=>st.guesses.filter(g=>!g.ok).length;
// Each clue costs 60 and each wrong guess 150; reading a picture right earns 60 back, misreading costs 40
const dailyScore=st=>Math.max(50,Math.min(1000,1000-60*dailyClues(st)-150*dailyWrong(st)+(st.rb||0)));
function dailyCase(date){
  const R=seeded('zebra-daily-'+date),pool=D.map((d,i)=>i).filter(i=>D[i].t>=1&&!D[i].late),di=pool[Math.floor(R()*pool.length)],d=D[di];
  const sex=d.x==='A'?(R()<.5?'M':'F'):d.x,age=d.a[0]+Math.floor(R()*(d.a[1]-d.a[0]+1));

}
function dailyState(date){const st=DAILY[date]=DAILY[date]||pzFresh();st.rd=st.rd||{};return st}
function dailyStreak(){let n=0;const t=new Date();for(;;){const s=DAILY[dayStr(t)];if(s&&s.won){n++;t.setDate(t.getDate()-1)}else if(n===0&&dayStr(t)===todayStr()&&!(s&&s.done)){t.setDate(t.getDate()-1)}else break}return n}

const APP_URL=/github\.io$/.test(location.hostname)?location.origin+location.pathname:'https://danchandrr.github.io/Dan-Claude/';
const b64u={enc:b=>{let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},
  dec:s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))};
async function packObj(o){
  const bytes=new TextEncoder().encode(JSON.stringify(o));
  if(window.CompressionStream){try{const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));return'z'+b64u.enc(new Uint8Array(await new Response(st).arrayBuffer()))}catch(e){}}
  return'j'+b64u.enc(bytes);
}
async function unpackObj(s){
  s=String(s||'').trim();const m=s.match(/[#&?](?:c|k|x)=([A-Za-z0-9_-]+)/);if(m)s=m[1];
  try{
    let bytes=b64u.dec(s.slice(1));
    if(s[0]==='z'){const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(st).arrayBuffer())}
    else if(s[0]!=='j')return null;
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){return null}
}
async function openCode(text,quiet){
  const o=await unpackObj(text);
  if(o&&o.t==='c'){chalFromPayload(o);return true}
  if(o&&o.t==='k'){caseFromPayload(o);return true}
  if(!quiet)toast('That code could not be read. Check it was copied in full.');
  return false;
}

function chalCases(seed,tags){
  const R=seeded('zebra-chal-'+seed),used=new Set();
  return CH_TIERS.map((t,k)=>{
    let di=tags&&tags[k]!=null?D.findIndex(d=>nameTag(d.n)===tags[k]):-1;
    const pool=D.map((d,i)=>i).filter(i=>D[i].t===t&&!used.has(i)),fallback=pool[Math.floor(R()*pool.length)];
    if(di<0)di=fallback;used.add(di);const d=D[di];
    const sex=d.x==='A'?(R()<.5?'M':'F'):d.x,age=d.a[0]+Math.floor(R()*(d.a[1]-d.a[0]+1));
    return{di,sex,age,name:nameFrom(sex,R(),R())};
  });
}

  const loops=[[110,140,290],[120,196,300],[100,252,280],[130,306,270]];
  let bowel='',valv='';
  loops.forEach(([x1,y,x2],i)=>{bowel+=`<path d="M${x1} ${y}H${x2}" stroke-width="34"/>`;
    if(i<loops.length-1){const n=loops[i+1],side=i%2?x1:x2,nx=i%2?n[0]:n[2];bowel+=`<path d="M${side} ${y}C${side+(i%2?-40:40)} ${y} ${nx+(i%2?-40:40)} ${n[1]} ${nx} ${n[1]}" stroke-width="32"/>`}
    for(let x=x1+8;x<x2-4;x+=9+R()*2)valv+=`<path d="M${x.toFixed(1)} ${y-15}C${(x+2).toFixed(1)} ${y-5} ${(x-2).toFixed(1)} ${y+5} ${x.toFixed(1)} ${y+15}"/>`});
  return`<svg class="xray" viewBox="0 0 400 440" role="img" aria-label="Abdominal X-ray">${defs}
   <rect width="400" height="440" fill="#050607"/>
   <path d="M40 10H360C376 160 380 300 372 440H28C20 300 24 160 40 10Z" fill="#4a4e50" filter="url(#xb8)"/>
   <path d="M44 20C90 16 150 30 196 70C170 110 110 120 60 112Z" fill="#6c7071" filter="url(#xb8)" opacity=".8"/>
   <g opacity=".35" fill="#e2e5e5">${Array.from({length:13},(_,i)=>`<rect x="187" y="${8+i*30}" width="26" height="24" rx="4"/>`).join('')}</g>
   <path d="M90 440C96 380 140 350 200 352C260 350 304 380 310 440" fill="none" stroke="#b4b8b8" stroke-width="14" opacity=".6" filter="url(#xb3)"/>
   <g fill="none" stroke="#141617" stroke-linecap="round" filter="url(#xb3)">${bowel}</g>
   <g fill="none" stroke="#7d8282" stroke-width="2" opacity=".85" filter="url(#xb1)">${valv}</g>
   <rect width="400" height="440" fill="url(#xvig)"/><text x="22" y="40" class="xrm">R</text></svg>`;
}

/* ---- Microscopy drawing ---- */
function micSVG(key){
  const R=seeded('mic-'+key),N=n=>n.toFixed(1),cx=200,cy=200;
  const stain={gramneg:'gram',grampos:'gram',boxcar:'gram',afb:'zn',vibrio:'dark',ldbodies:'marrow',bipolar:'wayson'}[key]||'film';
  const bg={film:'#f4e9ec',gram:'#f6eef2',zn:'#c9dbe9',dark:'#030506',marrow:'#efe2ea',wayson:'#eef0f6'}[stain];
  const spots=[];const place=(r,tries=40)=>{for(let k=0;k<tries;k++){const a=R()*Math.PI*2,d=Math.sqrt(R())*185,x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d;if(spots.every(s=>Math.hypot(s[0]-x,s[1]-y)>s[2]+r-2)){spots.push([x,y,r]);return[x,y]}}return null};
  let g='';
  const rbc=(x,y,r=14)=>`<circle cx="${N(x)}" cy="${N(y)}" r="${r}" fill="url(#rbc)"/>`;
  const cell=(x,y,r,shape)=>shape==='sickle'?`<path d="M${N(x-r)} ${N(y)}A${r} ${r*.55} -20 0 1 ${N(x+r)} ${N(y-3)}A${r*.8} ${r*.3} -20 0 0 ${N(x-r)} ${N(y)}Z" fill="#d97f95" transform="rotate(${N(R()*180)} ${N(x)} ${N(y)})"/>`
    :shape==='target'?`<circle cx="${N(x)}" cy="${N(y)}" r="${r}" fill="#e5a2b2"/><circle cx="${N(x)}" cy="${N(y)}" r="${r*.62}" fill="#f6dbe2"/><circle cx="${N(x)}" cy="${N(y)}" r="${r*.3}" fill="#d98a9d"/>`
    :shape==='schisto'?`<path d="M${N(x-r)} ${N(y+2)}A${r} ${r} 0 0 1 ${N(x+r)} ${N(y+2)}L${N(x+r*.2)} ${N(y-r*.1)}Z" fill="#da8aa0" transform="rotate(${N(R()*360)} ${N(x)} ${N(y)})"/>`
    :shape==='tri'?`<path d="M${N(x)} ${N(y-r*.8)}L${N(x+r*.8)} ${N(y+r*.6)}L${N(x-r*.7)} ${N(y+r*.5)}Z" fill="#da8aa0" transform="rotate(${N(R()*360)} ${N(x)} ${N(y)})"/>`:rbc(x,y,r);
  const neut=(x,y)=>{let s=`<circle cx="${N(x)}" cy="${N(y)}" r="19" fill="#ead3e4"/>`;for(let i=0;i<3+(R()*2|0);i++){const a=i*1.5+R();s+=`<ellipse cx="${N(x+Math.cos(a)*7)}" cy="${N(y+Math.sin(a)*7)}" rx="6" ry="4.5" fill="#7a3f86" transform="rotate(${N(a*57)} ${N(x+Math.cos(a)*7)} ${N(y+Math.sin(a)*7)})"/>`}return s};
  const pmn=(x,y,col)=>{let s=`<circle cx="${N(x)}" cy="${N(y)}" r="19" fill="${col[0]}"/>`;for(let i=0;i<3;i++){const a=i*2.1+R();s+=`<ellipse cx="${N(x+Math.cos(a)*7)}" cy="${N(y+Math.sin(a)*7)}" rx="6" ry="4.5" fill="${col[1]}"/>`}return s};
  if(stain==='film'){
    const n=key==='schisto'?34:44;
    for(let i=0;i<n;i++){const p=place(14);if(!p)continue;const[x,y]=p;
      if(key==='sickle')g+=cell(x,y,15,i%3===0?'sickle':i%5===1?'target':'rbc')+(i%11===4?`<circle cx="${N(x+5)}" cy="${N(y-4)}" r="2.2" fill="#4f2a68"/>`:'');
      else if(key==='schisto')g+=i%3===0?cell(x,y,11,i%2?'schisto':'tri'):rbc(x,y,13);
      else{g+=rbc(x,y);
        if(key==='malaria'&&i%4===0){const ring=(dx,dy)=>`<circle cx="${N(x+dx)}" cy="${N(y+dy)}" r="4.2" fill="none" stroke="#5c3b8f" stroke-width="1.3"/><circle cx="${N(x+dx+3.4)}" cy="${N(y+dy-2.6)}" r="1.5" fill="#3c1f6e"/>${R()<.5?`<circle cx="${N(x+dx+4.2)}" cy="${N(y+dy+1.2)}" r="1.3" fill="#3c1f6e"/>`:''}`;g+=ring(-3,-2)+(i%8===0?ring(4,4):'')}}
    }
    if(key==='malaria'){const p=place(20)||[110,300];g+=`<path d="M${N(p[0]-18)} ${N(p[1]+4)}C${N(p[0]-8)} ${N(p[1]-12)} ${N(p[0]+8)} ${N(p[1]-12)} ${N(p[0]+18)} ${N(p[1]+4)}C${N(p[0]+8)} ${N(p[1]-4)} ${N(p[0]-8)} ${N(p[1]-4)} ${N(p[0]-18)} ${N(p[1]+4)}Z" fill="#8c6bb5"/><circle cx="${N(p[0])}" cy="${N(p[1]-4)}" r="2.6" fill="#2f2440"/>`}
    if(key==='atypical')for(let i=0;i<2;i++){const p=place(30)||[120+i*140,140+i*100];g+=`<path d="M${N(p[0]-30)} ${N(p[1])}C${N(p[0]-28)} ${N(p[1]-30)} ${N(p[0]+20)} ${N(p[1]-34)} ${N(p[0]+32)} ${N(p[1]-6)}C${N(p[0]+40)} ${N(p[1]+16)} ${N(p[0]+12)} ${N(p[1]+20)} ${N(p[0]+4)} ${N(p[1]+32)}C${N(p[0]-14)} ${N(p[1]+30)} ${N(p[0]-34)} ${N(p[1]+20)} ${N(p[0]-30)} ${N(p[1])}Z" fill="#a9c3e6"/><ellipse cx="${N(p[0]-4)}" cy="${N(p[1]-2)}" rx="14" ry="12" fill="#5d3f8f"/>`}
    if(key==='tryp')for(let i=0;i<3;i++){const x=80+i*110+R()*20,y=90+R()*220;let d=`M${N(x)} ${N(y)}`;for(let k=1;k<=10;k++)d+=`L${N(x+k*6)} ${N(y+Math.sin(k*1.2+i)*6)}`;
      g+=`<path d="${d}" stroke="#7c4fa6" stroke-width="5" fill="none" stroke-linecap="round"/><path d="${d}" stroke="#c7a8e2" stroke-width="1.5" fill="none" transform="translate(0 -4)"/><circle cx="${N(x+30)}" cy="${N(y+Math.sin(5*1.2+i)*6)}" r="2.6" fill="#3b1f5c"/><circle cx="${N(x+4)}" cy="${N(y+1)}" r="1.6" fill="#2a1442"/><path d="M${N(x+60)} ${N(y+Math.sin(12+i)*6)}q8 -6 16 0" stroke="#7c4fa6" stroke-width="1.6" fill="none"/>`}
    if(key!=='schisto')for(let i=0;i<5;i++){const p=place(3,15);if(p)g+=`<circle cx="${N(p[0])}" cy="${N(p[1])}" r="2.4" fill="#8a5aa8"/>`}
    if(key==='sickle'||key==='malaria'){const p=place(19);if(p)g+=neut(p[0],p[1])}
  }else if(stain==='gram'||stain==='wayson'){
    const cols=stain==='gram'?['#f0cfdc','#c45a86']:['#e6e7f2','#5a5f9e'];
    for(let i=0;i<7;i++){const p=place(19);if(p)g+=pmn(p[0],p[1],cols)}
    const bug=(x,y)=>{const a=R()*180;
      if(key==='gramneg')return`<g transform="rotate(${N(a)} ${N(x)} ${N(y)})" fill="#d23a63"><ellipse cx="${N(x-2.4)}" cy="${N(y)}" rx="2.4" ry="3"/><ellipse cx="${N(x+2.4)}" cy="${N(y)}" rx="2.4" ry="3"/></g>`;
      if(key==='grampos')return`<g transform="rotate(${N(a)} ${N(x)} ${N(y)})" fill="#3d2678"><path d="M${N(x-6)} ${N(y)}Q${N(x-3)} ${N(y-3.4)} ${N(x)} ${N(y)}Q${N(x-3)} ${N(y+3.4)} ${N(x-6)} ${N(y)}Z M${N(x+6)} ${N(y)}Q${N(x+3)} ${N(y-3.4)} ${N(x)} ${N(y)}Q${N(x+3)} ${N(y+3.4)} ${N(x+6)} ${N(y)}Z"/></g>`;
      if(key==='boxcar'){let s='';for(let k=0;k<4;k++)s+=`<rect x="${N(x+k*13)}" y="${N(y-3)}" width="12" height="6" rx="1" fill="#3d2678"/>`;return`<g transform="rotate(${N(a)} ${N(x)} ${N(y)})">${s}</g>`}
      return`<g transform="rotate(${N(a)} ${N(x)} ${N(y)})"><rect x="${N(x-4)}" y="${N(y-2.4)}" width="8" height="4.8" rx="2.4" fill="#c9cbe6"/><circle cx="${N(x-2.6)}" cy="${N(y)}" r="2" fill="#2c3170"/><circle cx="${N(x+2.6)}" cy="${N(y)}" r="2" fill="#2c3170"/></g>`};
    for(let i=0;i<(key==='boxcar'?9:36);i++){const a=R()*Math.PI*2,d=Math.sqrt(R())*175;g+=bug(cx+Math.cos(a)*d,cy+Math.sin(a)*d)}
    if(key==='gramneg')spots.slice(0,4).forEach(([x,y])=>{for(let k=0;k<3;k++)g+=bug(x-8+R()*16,y-8+R()*16)});
  }else if(stain==='zn'){
    for(let i=0;i<9;i++){const p=place(18);if(p)g+=`<circle cx="${N(p[0])}" cy="${N(p[1])}" r="16" fill="#9cb8d6"/><ellipse cx="${N(p[0])}" cy="${N(p[1])}" rx="8" ry="6" fill="#3f5f96"/>`}
    for(let i=0;i<22;i++){const a=R()*Math.PI*2,d=Math.sqrt(R())*170,x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d,r=R()*180,len=9+R()*5;
      g+=`<g transform="rotate(${N(r)} ${N(x)} ${N(y)})"><path d="M${N(x-len/2)} ${N(y)}q${N(len/2)} ${N(R()*3-1.5)} ${N(len)} 0" stroke="#d01f4c" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="2.6 1" fill="none"/></g>`}
  }else if(stain==='dark'){
    for(let i=0;i<26;i++){const x=20+R()*360,y=20+R()*360,r=R()*360;g+=`<g transform="rotate(${N(r)} ${N(x)} ${N(y)})"><path d="M${N(x-6)} ${N(y)}q6 -5 12 0" stroke="#d9f4ff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M${N(x-14)} ${N(y+3)}q8 -5 14 -3" stroke="#d9f4ff" stroke-width="2" opacity=".25" fill="none"/></g>`}
    for(let i=0;i<5;i++){const x=40+R()*320,y=40+R()*320;g+=`<circle cx="${N(x)}" cy="${N(y)}" r="${N(4+R()*6)}" fill="none" stroke="#9fb4bd" stroke-width="1" opacity=".5"/>`}
  }else{
    for(let i=0;i<16;i++){const p=place(14);if(p)g+=`<circle cx="${N(p[0])}" cy="${N(p[1])}" r="13" fill="#e2b0bf"/>`}
    g+=`<path d="M110 150C120 96 210 86 262 118C312 150 304 226 262 262C222 296 140 290 116 250C100 222 104 180 110 150Z" fill="#c9b6d9"/><ellipse cx="236" cy="148" rx="30" ry="24" fill="#5b3c86"/>`;
    for(let i=0;i<46;i++){const a=R()*Math.PI*2,d=Math.sqrt(R())*72,x=190+Math.cos(a)*d*1.3,y=196+Math.sin(a)*d;if(Math.hypot(x-236,y-148)<30)continue;
      g+=`<ellipse cx="${N(x)}" cy="${N(y)}" rx="4.2" ry="3" fill="#a982c9"/><circle cx="${N(x-1)}" cy="${N(y)}" r="1.5" fill="#4a2675"/><rect x="${N(x+1.3)}" y="${N(y-.5)}" width="2.4" height="1" fill="#2a1442"/>`}
  }
  return`<svg class="micro" viewBox="0 0 400 400" role="img" aria-label="${READS[key].x2}"><defs><clipPath id="mfov"><circle cx="200" cy="200" r="194"/></clipPath>
   <radialGradient id="rbc"><stop offset=".25" stop-color="#f7dde4"/><stop offset=".7" stop-color="#e7a7b6"/><stop offset="1" stop-color="#d98a9d"/></radialGradient>
   <radialGradient id="mvig" cx="50%" cy="50%" r="50%"><stop offset=".72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient></defs>
   <rect width="400" height="400" fill="#000"/><g clip-path="url(#mfov)"><rect width="400" height="400" fill="${bg}"/>${g}<rect width="400" height="400" fill="url(#mvig)"/></g></svg>`;
}
let rdUid=0;
// Give every drawn picture its own ids so two on one page never borrow each other's gradients
const rdIds=(s,u)=>s.replace(/id="([^"]+)"/g,`id="$1-${u}"`).replace(/url\(#([^)]+)\)/g,`url(#$1-${u})`);
function readImage(key){const k=READS[key].k,u='r'+(rdUid++);return rdIds(readImageRaw(key,k),u)}
function readImageRaw(key,k){return k==='ecg'?`<div class="rdscroll">${ecgSVG(key)}</div><button class="btn rdzoom" data-act="rdzoom">${ic('search')}Zoom in</button>`:k==='abg'?abgHTML(key):k==='xr'?`<div class="rdpic">${xrSVG(key)}</div>`:`<div class="rdpic">${micSVG(key)}</div>`}

/* ---- Reading a picture during play ---- */
// A clue that has a picture stays hidden behind a "read it yourself" button until the player reads or skips it
function clueLi(d,c,k,rd,isNew){
  const key=readKey(d,c,k),res=rd&&rd[c+k];
  if(key&&!res)return`<li class="rdwait ${isNew?'new':''}"><button class="rdbtn" data-read="${c}${k}">${ic(RD_KIND[READS[key].k][1])}<span><b>${esc(readTitle(key))} ready</b><small>Read it yourself before the report</small></span></button></li>`;
  const chip=key&&res?`<button class="rdchip ${res}" data-study="${key}" title="Look at it again">${ic(RD_KIND[READS[key].k][1])}${res==='ok'?'read it':res==='bad'?'misread':'report only'}</button>`:'';
  return`<li class="${isNew?'new':''}">${esc(d[c][k])}${chip}</li>`;
}
// The pinned "New:" line on phones should not give the report away before it is read
const clueText=(d,c,k,rd)=>{const key=readKey(d,c,k);return key&&!(rd&&rd[c+k])?readTitle(key)+' ready to read':d[c][k]};
function rdHost(){let el=document.getElementById('readov');if(!el){el=document.createElement('div');el.id='readov';document.body.appendChild(el)}return el}
// where: 'bed' (a patient on the floor), 'pz' (a puzzle case), 'study' (look again), 'drill' (Reading room)
function openRead(where,c,k,key){
  let d=null;
  if(where==='bed'){const p=curP();if(!p)return;d=D[p.d];key=readKey(d,c,k);S.read={where,c,k,key,pid:p.id}}
  else if(where==='pz'){const x=pzCtx();if(!x)return;d=x.d;key=readKey(d,c,k);S.read={where,c,k,key}}
  else S.read={where,key};
  if(!key||!READS[S.read.key]){S.read=null;return}
  const r=READS[S.read.key],R=seeded('opts-'+S.read.key+(S.read.pid||'')+Date.now());
  S.read.opts=r.o.map((t,i)=>({t,i})).sort(()=>R()-.5);S.read.pick=null;
  sfx(r.k==='ecg'?'beep':r.k==='xr'?'xray':'lab');renderRead();
}
function renderRead(){
  const el=rdHost(),o=S.read;if(!o){el.innerHTML='';return}
  const r=READS[o.key],[kind,icn]=RD_KIND[r.k],done=o.pick!=null,ok=done&&o.pick===0,study=o.where==='study';
  const ctx=o.where==='bed'?`Right: +${isDiag()?2:1} stability · wrong: −1 stability`:o.where==='pz'?'Right: +60 points · wrong: −40 points':o.where==='drill'?'Practice: nothing at stake':'';
  const opts=o.opts.map(({t,i})=>`<button data-rdpick="${i}" class="${done?(i===0?'right':i===o.pick?'wrong':''):''}" ${done?'disabled':''}>${esc(t)}</button>`).join('');
  const report=o.where==='bed'||o.where==='pz'?(()=>{const d=o.where==='bed'?D[(curP()||{}).d]:(pzCtx()||{}).d;return d&&d[o.c]?`<p class="rdrep"><b>Report:</b> ${esc(d[o.c][o.k])}</p>`:''})():'';
  el.innerHTML=`<div class="emov minov rdov" role="dialog" aria-modal="true" aria-label="${esc(readTitle(o.key))}"><div class="panel minicard rdcard">
   <div class="minihead">${ic(icn)}<div><span class="label">${study?'Look again':o.where==='drill'?'Reading room':'Read it yourself'} · ${kind}</span><h2>${esc(readTitle(o.key))}</h2></div><button class="iconbtn rdx" data-act="rdclose" aria-label="Close">${ic('x')}</button></div>
   ${readImage(o.key)}
   <p class="rdq"><b>${r.k==='ecg'?'What does this ECG show?':r.k==='abg'?'How would you interpret this gas?':r.k==='xr'?'What is the main finding?':'What do you see?'}</b>${ctx&&!done?` <span class="hint">${ctx}</span>`:''}</p>
   <div class="rdopts">${opts}</div>
   ${done?`<div class="minimsg ${ok||o.pick<0?'good':''}">${ok?'Right read.':o.pick<0?'Answer: '+esc(r.o[0])+'.':'Not quite.'} ${esc(r.x)}</div>${report}`:''}
   <div class="rdfoot">${done?`<button class="btn primary" data-act="${o.where==='drill'?'rdnext':'rdclose'}">${o.where==='drill'?ic('play')+'Next one':ic('check')+'Done'}</button>${o.where==='drill'?`<button class="btn" data-act="rdclose">Stop</button>`:''}${reportLink('r',o.key)}`
     :o.where==='bed'||o.where==='pz'?`<button class="btn" data-act="rdskip">Skip and read the report</button>`:`<button class="btn" data-act="rdreveal">Show the answer</button>`}</div>
  </div></div>`;
}
function readPick(i){
  const o=S.read;if(!o||o.pick!=null)return;
  o.pick=+i;const ok=o.pick===0,kind=READS[o.key].k;
  sfx(ok?'right':'wrong');
  if(o.where==='bed'){const p=curP();if(p&&p.id===o.pid){p.rd=p.rd||{};p.rd[o.c+o.k]=ok?'ok':'bad';if(ok)p.stab=Math.min(p.max,p.stab+(isDiag()?2:1));else p.stab--;save()}}
  else if(o.where==='pz'){const x=pzCtx();if(x){x.st.rd=x.st.rd||{};x.st.rd[o.c+o.k]=ok?'ok':'bad';x.st.rb=(x.st.rb||0)+(ok?60:-40);x.save()}}
  achEvent('read',{ok,kind,key:o.key,where:o.where});
  renderRead();
}
function readClose(skip){
  const o=S.read;if(!o)return;
  if(skip&&o.pick==null){
    if(o.where==='bed'){const p=curP();if(p&&p.id===o.pid){p.rd=p.rd||{};p.rd[o.c+o.k]='skip';save()}}
    else if(o.where==='pz'){const x=pzCtx();if(x){x.st.rd=x.st.rd||{};x.st.rd[o.c+o.k]='skip';x.save()}}
  }
  S.read=null;renderRead();
  if(o.where==='bed'){const p=curP();if(p&&p.stab<=0&&p.phase!=='arrest')arrest(S.sel);save()}
  render();
}
const READ_KEYS=Object.keys(READS);
function drillNext(kind){
  const pool=READ_KEYS.filter(k=>!kind||READS[k].k===kind),last=S.read&&S.read.key;
  let key=pick(pool);if(pool.length>1)while(key===last)key=pick(pool);
  S.ui.drill=kind||'';openRead('drill',null,null,key);
}

/* ===================== ACHIEVEMENTS ===================== */
// Kept outside the career slots, so they follow the player across careers and modes
const AKEY='zebra-shift.ach';
let ACH={u:{},c:{},r:{},hq:null};try{const a=JSON.parse(localStorage.getItem(AKEY)||'null');if(a&&a.u)ACH={u:a.u,c:a.c||{},r:a.r||{},hq:a.hq||null}}catch(e){}
const saveAch=()=>{try{localStorage.setItem(AKEY,JSON.stringify(ACH))}catch(e){}if(window.ZSOnline&&ZSOnline.onStore)ZSOnline.onStore()};
// Fold in achievements and unlocks from another device: nothing earned anywhere is ever lost
function achMerge(o){
  if(!o||typeof o!=='object')return false;let changed=false;
  for(const k of ['u','r'])for(const id in (o[k]||{})){if(!ACH[k][id]&&o[k][id]){ACH[k][id]=o[k][id];changed=true}}
  for(const k in (o.c||{})){const v=o.c[k];
    if(k==='camSeen'){const set=new Set(String(ACH.c.camSeen||'').split(',').concat(String(v||'').split(',')).filter(Boolean));const s2=[...set].join(',');if(s2!==(ACH.c.camSeen||'')){ACH.c.camSeen=s2;ACH.c.cameos=Math.max(ACH.c.cameos||0,set.size);changed=true}}
    else if(typeof v==='number'&&v>(ACH.c[k]||0)){ACH.c[k]=v;changed=true}}
