const RP_KINDS=[['clue','A clue or result is wrong'],['answer','The diagnosis does not fit the clues'],['tx','The treatment or options are wrong'],['picture','The picture looks wrong'],['teach','The teaching point is wrong'],['typo','Typo or wording'],['other','Something else']];
const reportLink=(kind,subj)=>`<button class="linkbtn rplink" data-report="${kind}|${esc(subj)}">${ic('alert')}Report a problem</button>`;
function rpHost(){let el=document.getElementById('repov');if(!el){el=document.createElement('div');el.id='repov';document.body.appendChild(el)}return el}
function openReport(spec){const i=spec.indexOf('|');S.rep={k:spec.slice(0,i),subj:spec.slice(i+1),sent:false,busy:false};renderReport()}
function renderReport(){
  const el=rpHost(),r=S.rep;if(!r){el.innerHTML='';return}
  const pic=r.k==='r',title=pic&&READS[r.subj]?readTitle(r.subj):r.subj;
  const kinds=RP_KINDS.filter(([k])=>pic?['picture','answer','teach','typo','other'].includes(k):k!=='picture');
  el.innerHTML=`<div class="emov minov" role="dialog" aria-modal="true" aria-label="Report a problem"><div class="panel minicard">
   <div class="minihead">${ic('alert')}<div><span class="label">Report a problem${pic?' with this picture':''}</span><h2>${esc(title)}</h2></div><button class="iconbtn rdx" data-act="rpclose" aria-label="Close">${ic('x')}</button></div>
   ${r.sent?`<div class="minimsg good">Thank you. The report has been sent.</div><div class="rdfoot"><button class="btn primary" data-act="rpclose">Done</button></div>`:`
   <label class="edf"><span>What is wrong?</span><select id="rpkind">${kinds.map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label>
   <label class="edf"><span>Details <small>what it should say, and a source if you have one</small></span><textarea id="rpnote" rows="4" maxlength="1000" placeholder="For example: with these ECG changes, IV calcium should come first"></textarea></label>
   <p class="hint" style="margin:0">The report includes the ${pic?'picture':'case'} name and your note, plus your username if you are signed in.</p>
   <div class="rdfoot"><button class="btn primary" data-act="rpsend" ${r.busy?'disabled':''}>${ic('send')}${r.busy?'Sending…':'Send report'}</button><button class="btn" data-act="rpclose">Cancel</button></div>`}</div></div>`;
}
async function sendReport(){
  const r=S.rep;if(!r||r.busy)return;
  const kind=($('#rpkind')||{}).value||'other',note=(($('#rpnote')||{}).value||'').trim().slice(0,1000);
  const payload={subject:((r.k==='r'?'Picture: ':'Case: ')+r.subj).slice(0,120),kind,note,context:{screen:S.screen,spec:(S.doctor&&S.doctor.spec)||null,picture:r.k==='r'?r.subj:null}};
  if(window.ZSOnline&&ZSOnline.sendReport){
    r.busy=true;renderReport();const ok=await ZSOnline.sendReport(payload);r.busy=false;
    if(ok)r.sent=true;else toast('Could not send. Check your connection and try again.');
    renderReport();return;
  }
  // Inside Claude there is no server to send to, so copy the report instead
  const text=`Zebra Shift report\n${payload.subject}\nProblem: ${(RP_KINDS.find(x=>x[0]===kind)||[])[1]}\n${note}`;
  try{await navigator.clipboard.writeText(text);toast('Copied. Reports are sent from the app version; paste this to the developer.')}catch(e){toast('Reports are sent from the app version of the game.')}
  S.rep=null;renderReport();
}

// A guided first patient on a new player's first run, then one-time tips the first time each system turns up
const TKEY='zebra-shift.tut';
let TUT=null;try{TUT=JSON.parse(localStorage.getItem(TKEY)||'null')}catch(e){}
const saveTut=()=>{try{localStorage.setItem(TKEY,JSON.stringify(TUT))}catch(e){}};
// Players from before the tutorial existed skip the guided patient, and only get tips for newer features
function tutInit(){
  if(TUT&&TUT.tips)return;
  const old=STORE.slots.some(s=>s&&s.meta&&(s.meta.runs||0)>0);
  TUT={done:old,tips:old?{proc:1,arrest:1,em:1,grand:1,staff:1,req:1,brk:1,daily:1}:{}};saveTut();
}
const tutWanted=()=>!!(TUT&&!TUT.done);
function tutPatient(){
  const p=makePatient(false);
  Object.assign(p,{d:IDX['Acute Appendicitis'],name:'Maya Tan',sex:'F',age:24,cam:null,masked:false,turned:false,stab:20,max:20,rev:{h:0,e:0,l:0,i:0},
    showSys:false,showTier:false,letter:false,dxName:false,procs:[],focus:false,last:null,tut:true});
  return p;
}
function tutFinish(skipped){
  const r=S.run;TUT.done=true;saveTut();S.meta.intro=false;
  if(r){for(const p of r.beds.concat(r.queue))if(p)delete p.tut;
    if(r.tut){r.tut=false;spawn();spawn()}}
  coachKey=null;S.tipNow=skipped?null:'tutdone';save();render();
}
function tutStep(){
  const r=S.run;if(!r||!r.tut||S.screen!=='game'||r.phase!=='floor')return null;
  const i=r.beds.findIndex(b=>b&&b.tut);if(i<0)return null;
  const p=r.beds[i],her=p.sex==='F'?'her':'him';
  if(S.tab!=='shift')return{k:'back',n:1,t:'Head back to the ER Floor to finish your first patient.',sel:'[data-tab="shift"]'};
  if(S.sel!==i)return{k:'bed',n:1,t:`Your first patient, ${p.name}, is in Bay ${i+1}. Tap the bay to see ${her}. Nobody else arrives until you are done, and ${her} condition will not slip while you learn.`,sel:`[data-bed="${i}"]`};
  if(p.phase==='case'){
    if(!p.rev.h)return{k:'h',n:2,t:'Each order reveals one clue and costs a little stability. Start by taking a History.',sel:'[data-ord="h"]'};
    if(!p.rev.e)return{k:'e',n:3,t:'Clues land in the chart. Now Examine '+her+'.',sel:'[data-ord="e"]'};
    if(!p.rev.l)return{k:'l',n:4,t:'Order a Test. Some results come as an ECG, X-ray, blood gas or slide that you read yourself.',sel:'[data-ord="l"]'};
    return{k:'dx',n:5,t:'Enough to go on? Type the diagnosis, pick it from the list and press Submit. A wrong guess costs stability, but tells you whether you were in the right organ system.',sel:'.dx .combo'};
  }
  if(p.phase==='treat')return{k:'tx',n:6,t:'Right diagnosis. Now choose the treatment. Wrong choices cost stability.',sel:'.tx'};
  if(p.phase==='dispo')return{k:'dispo',n:7,t:'Treated. Now decide where '+(p.sex==='F'?'she goes':'he goes')+'. Sending home someone who needed a bed costs reputation, and they come back worse.',sel:'.dispo'};
  if(p.phase==='done')return{k:'clear',n:8,t:'Points become grant money for items in the Requisition cabinet. Clear the bay to make room for the next patient.',sel:'[data-act="clear"]'};
  if(p.phase==='arrest')return{k:'arr',n:6,t:'Cardiac arrest. Press Start CPR, tap in rhythm, then call the rhythm at the check.',sel:'[data-act="cpr"]'};
  return null;
}

 read:{t:'This result is a picture. Read it yourself before the report: a right read gives +1 stability, a misread costs 1. You can also skip to the report.',sel:'.rdbtn',when:()=>inGame()&&!!document.querySelector('.rdbtn')},

let coachKey=null,coachTarget=null;
function coachHost(){let el=document.getElementById('coach');if(!el){el=document.createElement('div');el.id='coach';el.setAttribute('role','status');el.hidden=true;document.body.appendChild(el)}return el}
// Runs after every render: shows the current tutorial step or tip, and highlights what to press
function tutAfterRender(){
  if(!TUT)return;
  const el=coachHost();
  document.querySelectorAll('.tutpulse').forEach(x=>x.classList.remove('tutpulse'));
  const r=S.run;
  if(inGame()&&r.tut&&!r.beds.some(b=>b&&b.tut)){setTimeout(()=>tutFinish(false),0);return}
  const busy=S.mini||S.cpr||S.read||S.rep;
  let step=busy?null:tutStep(),tip=null;
  if(!step&&!busy&&!(r&&r.tut)){
    if(S.tipNow&&TIPS[S.tipNow]&&TIPS[S.tipNow].when())tip=S.tipNow;
    else{S.tipNow=null;for(const k in TIPS)if(k!=='tutdone'&&!TUT.tips[k]&&TIPS[k].when()){tip=k;TUT.tips[k]=1;saveTut();S.tipNow=k;break}}
  }
  const key=step?'step:'+step.k:tip?'tip:'+tip:null,sel=step?step.sel:tip&&TIPS[tip].sel;
  if(!key){el.hidden=true;coachKey=null;document.body.classList.remove('coaching');return}
  if(key!==coachKey){
    coachKey=key;el.hidden=false;
    el.innerHTML=`<div class="coachhead">${ic(step?'help':'star')}<span class="label">${step?`First patient · step ${step.n} of 8`:'Tip'}</span></div><p>${esc(step?step.t:TIPS[tip].t)}</p>
      <div class="rowbtns">${step?`<button class="linkbtn" data-act="tutskip">Skip the tutorial</button>`:`<button class="btn primary" data-act="tipok">Got it</button>`}</div>`;
    document.body.classList.add('coaching');document.documentElement.style.setProperty('--coachh',el.offsetHeight+'px');
  }
  // highlight the first visible match, and bring it into view when the step changes
  const t=sel&&[...document.querySelectorAll(sel)].find(x=>x.offsetParent!==null);
  if(t){t.classList.add('tutpulse');if(coachTarget!==key){coachTarget=key;if(step)t.scrollIntoView({block:'center',behavior:'smooth'})}}
}

// Each row becomes runs of same-coloured rects, so a sprite is a few dozen SVG elements at most
function pixIcon(id,cls='pix'){
  const rows=PIX[id];if(!rows)return ic(TOOL_IC[id]||'cross');
  let out='';
  rows.forEach((row,y)=>{let x=0;while(x<16){const ch=row[x];if(ch==='.'||!PIX_PAL[ch]){x++;continue}let w=1;while(x+w<16&&row[x+w]===ch)w++;out+=`<rect x="${x}" y="${y}" width="${w}" height="1" fill="${PIX_PAL[ch]}"/>`;x+=w}});
  return`<svg class="${cls}" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">${out}</svg>`;
}

/* ---- PIXIS MedStation: each requisition plays out at an automated dispensing cabinet ---- */
// Drawer lights climb through the rarity colours and stop at the item's rarity before the drawer opens
const RCOL=['#9fb3bd','#4a90ff','#b06bff','#ffc93c'];
let PYX=null;
function pyxHost(){let el=document.getElementById('pyxov');if(!el){el=document.createElement('div');el.id='pyxov';document.body.appendChild(el)}return el}
function pyxPlay(res){
  if(reduced||!res||!res.length)return;
  const n=res.length,slots=n===1?6:10,cols=n===1?3:2;
  // reveal from the most common to the rarest, so the best item comes last
  const order=res.map((x,i)=>({...x,r:TOOL[x.id].r,i})).sort((a,b)=>a.r-b.r||a.i-b.i);
  PYX={skip:false,done:false,n,order,pos:n===1?[rnd(slots)]:order.map((_,k)=>k)};
  pyxHost().innerHTML=`<div class="emov minov pyxov" role="dialog" aria-modal="true" aria-label="Requisition">
   <div class="pyxwrap"><div class="pyx"><div class="pyxbrand"><span>PIXIS · MEDSTATION</span><span>ED CABINET 02</span></div>
    <div class="pyxscreen" id="pyxscr"></div><div class="pyxkeys">${'<i></i>'.repeat(12)}</div>
    <div class="pyxgrid n${slots}">${Array.from({length:slots},(_,k)=>`<div class="pyxdr" id="pyxd${k}"><div class="tray"></div><div class="item"></div><div class="front"><span class="led"></span><b>${String.fromCharCode(65+Math.floor(k/cols))}${k%cols+1}</b><span class="handle"></span></div></div>`).join('')}</div></div>
    <div class="pyxcap" id="pyxcap" aria-live="polite"></div>
    <div class="pyxbtns"><button class="btn" data-act="pyxskip" id="pyxskip">Skip</button></div></div></div>`;
  pyxRun(PYX);
}
async function pyxRun(P){
  const scr=$('#pyxscr'),stop=()=>P.skip||PYX!==P,w=ms=>new Promise(r=>setTimeout(r,P.skip?0:ms));
  const line=(t,cls='')=>scr.insertAdjacentHTML('beforeend',`<div class="${cls}">${t}</div>`);
  const keys=[...document.querySelectorAll('.pyxkeys i')],press=()=>{const k=pick(keys);k.classList.add('on');setTimeout(()=>k.classList.remove('on'),90)};
  const type=async(label,text,mask)=>{line(label);const el=scr.lastChild;for(const ch of text){if(stop())return;el.textContent+=mask?'•':ch;sfx('type');press();await w(55)}};
  line('PIXIS MedStation v4.2');line('Sign in to dispense');await w(380);if(stop())return;
  await type('USER  ',('DR.'+((S.doctor&&S.doctor.last)||'REYES')).toUpperCase().replace(/[^A-Z.]/g,'').slice(0,14));if(stop())return;
  await type('PASS  ','xxxxxxx',true);if(stop())return;
  line('BIO-ID <span class="pyxscan"><i></i></span>');await w(760);if(stop())return;
  sTone(880,.08,{g:.04});sTone(1320,.14,{g:.04,at:.08});line('ACCESS GRANTED','ok');await w(480);if(stop())return;
  scr.innerHTML='';line(`REQUISITION ×${P.n}`);line(`Dispensing ${P.n} item${P.n>1?'s':''}…`);
  const leds=[...document.querySelectorAll('.pyxdr .led')];
  for(let s=0;s<leds.length*2;s++){if(stop())return;leds.forEach(l=>l.classList.remove('on'));const l=leds[s%leds.length];l.style.setProperty('--led','#fff');l.classList.add('on');sfx('click');await w(50)}
  leds.forEach(l=>l.classList.remove('on'));
  for(let k=0;k<P.order.length;k++){if(stop())return;await pyxOpen(P,k,w,stop)}
  if(!stop())pyxFinish();
}
async function pyxOpen(P,k,w,stop){
  const it=P.order[k],dr=$('#pyxd'+P.pos[k]);if(!dr)return;
  const led=dr.querySelector('.led'),fast=P.n>1;
  led.style.setProperty('--led','#fff');
  for(let f=0;f<4;f++){led.classList.toggle('on');await w(fast?55:100)}
  led.classList.add('on');
  for(let r=0;r<=it.r;r++){if(stop())return;led.style.setProperty('--led',RCOL[r]);dr.style.setProperty('--rc',RCOL[r]);sTone(520*Math.pow(1.26,r),.09,{type:'square',g:.025});await w(r<it.r?(fast?150:260):70)}
  if(stop())return;
  dr.classList.add('open','r'+it.r);dr.querySelector('.item').innerHTML=pixIcon(it.id);sfx('drawer');
  pyxCaption(it);pyxFx(dr,it.r);
  await w(it.r===3?1800:it.r===2?(fast?950:1300):(fast?520:1100));
}
function pyxCaption(it){
  const t=TOOL[it.id],tag=it.tag==='NEW'?'New item':it.tag==='+30'?'Already maxed · ₲30 back':'Levelled up to '+it.tag.replace('LV ','Lv ');
  const c=$('#pyxcap');if(c)c.innerHTML=`<span style="color:${RCOL[t.r]}">${'★'.repeat(t.r+1)} ${RNAME[t.r]}</span><b>${esc(t.n)}</b><span>${esc(tag)}</span>`;
}
function pyxFx(dr,r){
  [523,659,784,1047,1319].slice(0,r+2).forEach((f,k)=>sTone(f,.45,{type:'triangle',g:.035,at:.05+k*.07}));
  if(r<2)return;
  const box=dr.getBoundingClientRect(),fx=document.createElement('div');fx.className='pyxfx';
  for(let i=0;i<(r===3?30:14);i++){const a=Math.random()*Math.PI*2,d=60+Math.random()*(r===3?170:90);
    fx.insertAdjacentHTML('beforeend',`<i class="spark" style="left:${box.left+box.width/2}px;top:${box.top+box.height/2}px;--rc:${RCOL[r]};--dx:${(Math.cos(a)*d).toFixed(0)}px;--dy:${(Math.sin(a)*d).toFixed(0)}px;animation-delay:${(Math.random()*.15).toFixed(2)}s"></i>`)}
  if(r===3){fx.insertAdjacentHTML('beforeend','<div class="pyxflash"></div>');const s=$('#pyxscr');if(s)s.insertAdjacentHTML('beforeend','<div class="gold">CONTROLLED ITEM · WITNESS SIGNED</div>')}
  document.body.appendChild(fx);setTimeout(()=>fx.remove(),1700);
}
// Skip, or the end of the sequence: every drawer open and lit, then a Done button
function pyxFinish(){
  const P=PYX;if(!P||P.done)return;P.done=true;
  P.order.forEach((it,k)=>{const dr=$('#pyxd'+P.pos[k]);if(!dr)return;dr.style.setProperty('--rc',RCOL[it.r]);const led=dr.querySelector('.led');led.style.setProperty('--led',RCOL[it.r]);led.classList.add('on');dr.classList.add('open','r'+it.r);dr.querySelector('.item').innerHTML=pixIcon(it.id)});
  const best=P.order[P.order.length-1];
  if(P.n>1){const c=$('#pyxcap');if(c)c.innerHTML=`<span>${P.n} items dispensed · best</span><b>${esc(TOOL[best.id].n)}</b><span style="color:${RCOL[best.r]}">${'★'.repeat(best.r+1)} ${RNAME[best.r]}</span>`}
  else pyxCaption(best);
  const b=$('#pyxskip');if(b){b.textContent='Done';b.dataset.act='pyxdone';b.classList.add('primary');b.focus()}
}
function pyxClose(){PYX=null;pyxHost().innerHTML='';render()}

function cardWrap(g,text,x,y,maxW,lh,maxLines=4){
  const words=String(text).split(' ');let line='',n=0;
  for(const w of words){const t=line?line+' '+w:w;if(g.measureText(t).width>maxW&&line){g.fillText(line,x,y);y+=lh;line=w;if(++n>=maxLines-1){line=words.slice(words.indexOf(w)).join(' ');while(g.measureText(line+'…').width>maxW)line=line.slice(0,-1);g.fillText(line+(line.length<text.length?'…':''),x,y);return y+lh}}else line=t}
  if(line){g.fillText(line,x,y);y+=lh}return y;
}

let acSel=0,acItems=[];
const NAMES=D.map(d=>({n:d.n,al:d.al||[]})).sort((a,b)=>a.n.localeCompare(b.n));
function acUpdate(){
  const inp=$('#dxin'),list=$('#dxlist');if(!inp||!list)return;
  const q=inp.value.trim().toLowerCase(),p=pzMode()?pzAc():curP();if(!p)return;
  if(!q){list.hidden=true;inp.setAttribute('aria-expanded','false');return}
  // Differential Engine Lv3+ puts the patient's organ system first; Lv5 offers only that system
  const eng=pzMode()?0:mods().engine,sys=eng?D[p.d].s:null,inSys=n=>IDX[n]!=null&&D[IDX[n]].s===sys;
  acItems=(pzMode()?pzNames():NAMES).filter(x=>!p.guesses.some(g=>g.n===x.n)&&(eng<2||inSys(x.n))).map(x=>{
    if(x.n.toLowerCase().includes(q))return{n:x.n,via:''};
    const a=x.al.find(a=>a.toLowerCase().includes(q));return a?{n:x.n,via:a}:null;
  }).filter(Boolean);
  if(eng>=1)acItems.sort((a,b)=>inSys(b.n)-inSys(a.n));
  acItems=acItems.slice(0,12);
  acSel=Math.min(acSel,Math.max(0,acItems.length-1));
  list.innerHTML=acItems.length?acItems.map((x,i)=>`<button role="option" data-ac="${esc(x.n)}" aria-selected="${i===acSel}">${esc(x.n)}${x.via?`<small>${esc(x.via)}</small>`:''}</button>`).join(''):`<div style="padding:8px;color:var(--muted);font-size:14px">No match. Try another name.</div>`;
  list.hidden=false;inp.setAttribute('aria-expanded','true');
}
function acSubmit(){
  const inp=$('#dxin');if(!inp)return;
  const q=inp.value.trim().toLowerCase();
  let name=null;
  const exact=(pzMode()?pzNames():NAMES).find(x=>x.n.toLowerCase()===q||x.al.some(a=>a.toLowerCase()===q));
  if(acItems.length&&!$('#dxlist').hidden)name=acItems[acSel].n;
  else if(exact)name=exact.n;
  if(!name){toast('Pick a diagnosis from the list');return}
  acSel=0;(pzMode()?pzGuess:guess)(name);
}

/* ===================== ECG ===================== */
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ecgStates=new WeakMap();
// One beat-by-beat generator; rhythm changes the waveform (AF, AV block, ST elevation, peaked or inverted T, alternans, Brugada, asystole).
function ecgSample(st,rhythm,hr){
  const t=st.t;
  if(rhythm==='asystole')return .015*Math.sin(t*1.7);
  if(rhythm==='vfib')return .35*Math.sin(t*2*Math.PI*4.6)+.2*Math.sin(t*2*Math.PI*7.3+1.3)*Math.sin(t*.9);
  if(rhythm==='torsades')return .55*Math.sin(t*2*Math.PI*3.6)*(.25+.75*Math.abs(Math.sin(t*Math.PI*.45)));
  if(t>=st.next){st.bs=st.next;st.idx++;let rr=60/Math.max(20,hr);if(rhythm==='afib')rr*=.6+Math.random()*.8;st.rr=rr;st.next=st.bs+rr;st.drop=rhythm==='avblock'&&st.idx%3===0}
  const x=t-st.bs,k=Math.sqrt(Math.min(1.2,st.rr/.8));
  const g=(c,w,a)=>a*Math.exp(-(((x-c)/w)**2));
  let v=0;
  if(rhythm==='vt')return g(.1,.045,.85)-g(.22,.06,.45);
  if(rhythm==='afib')v+=.035*Math.sin(t*2*Math.PI*6.3)+.025*Math.sin(t*2*Math.PI*9.1+.7);
  else if(rhythm!=='svt')v+=g(.05,.022,.13);
  if(rhythm==='pericarditis')v-=g(.11,.02,.04);
  if(!st.drop){
    const qa=rhythm==='alternans'?(st.idx%2?.5:.3):1;
    v+=-g(.15,.008,.12*qa)+g(.17,.009,qa)-g(.19,.01,.25*qa);
    const tc=.17+.2*k,tw=.045*k;
    if(rhythm==='peaked')v+=g(tc,.022*k,.62);
    else if(rhythm==='twinv')v-=g(tc,tw*1.2,.32);
    else if(rhythm==='brugada')v+=g(.205,.03,.32)-g(tc,tw,.18);
    else v+=g(tc,tw,rhythm==='alternans'?.12:.26);
    if(rhythm==='stemi')v+=g(.17+.12*k,.07*k,.34);
    if(rhythm==='pericarditis')v+=g(.17+.12*k,.08*k,.14);
  }
  return v;
}
function ecgFrame(ts){
  document.querySelectorAll('canvas.ecg').forEach(c=>{
    let st=ecgStates.get(c);
    if(!st){
      if(!c.clientWidth)return;
      const dpr=devicePixelRatio||1;c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;
      const ctx=c.getContext('2d');ctx.scale(dpr,dpr);
      st={ctx,x:0,prev:null,t:0,next:0,bs:-10,idx:0,rr:1,drop:false,last:ts};ecgStates.set(c,st);
      if(reduced){const W=c.clientWidth,H=c.clientHeight,rh=c.dataset.rhythm,hr=+c.dataset.hr;ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--mon-hr').trim()||'#5BE38A';ctx.lineWidth=1.8;ctx.beginPath();
        for(let x=0;x<W;x++){st.t=x/70;const y=H*.6-ecgSample(st,rh,hr)*H*.5;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
    }
    if(reduced)return;
    const W=c.clientWidth,H=c.clientHeight,rh=c.dataset.rhythm,hr=+c.dataset.hr;
    const dt=Math.min(.05,(ts-st.last)/1000);st.last=ts;
    const col=rh==='asystole'?'#FF6B5E':(getComputedStyle(document.documentElement).getPropertyValue('--mon-hr').trim()||'#5BE38A');
    const steps=Math.max(1,Math.round(dt*70)),ctx=st.ctx;
    for(let s=0;s<steps;s++){
      st.t+=1/70;
      const y=H*.6-ecgSample(st,rh,hr)*H*.5;
      ctx.clearRect(st.x,0,10,H);
      if(st.prev!==null){ctx.strokeStyle=col;ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(st.x-1,st.prev);ctx.lineTo(st.x,y);ctx.stroke()}
      st.prev=y;st.x++;if(st.x>W){st.x=0;st.prev=null}
    }
  });
  requestAnimationFrame(ecgFrame);
}

    if(S.run&&S.run.phase){const sel=S.sel,pz=S.paused;fixRun(S.run);S.sel=sel;S.paused=pz}

  requestAnimationFrame(ecgFrame);
}
